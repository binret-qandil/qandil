name: Publish quiz site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: unzip -o 2-site-deploy-1648.zip -d bundle && unzip -o 2-patch1659.zip -d bundle && unzip -o 1-score-words.zip -d bundle && unzip -o 1-final1647.zip -d bundle && unzip -o 1-print-site-0.zip -d bundle && unzip -o 2-print-site-1.zip -d bundle && unzip -o 1-q14-sync.zip -d bundle && unzip -o 2-1-source-sync.zip -d bundle && unzip -o 1-prime-source-sync.zip -d bundle && mv bundle/site public && cp -r usus public/usus && unzip -o 13-usus-correction-overlay.zip -d public/usus && unzip -o 1-usus-fix2-overlay.zip -d public/usus && unzip -o 1-usus-q06-overlay.zip -d public/usus && unzip -o 1-usus-q1920-overlay.zip -d public/usus && unzip -o 3-pv-preview-pkg.zip -d public && unzip -o 33-l11-v7-page.zip -d public/v11-qz4m8k && unzip -o 17-l11v7.chunk00.zip -d tmpv && unzip -o 24-l11v7.chunk01.zip -d tmpv && unzip -o 25-l11v7.chunk02.zip -d tmpv && unzip -o 26-l11v7.chunk03.zip -d tmpv && unzip -o 27-l11v7.chunk04.zip -d tmpv && unzip -o 28-l11v7.chunk05.zip -d tmpv && unzip -o 29-l11v7.chunk06.zip -d tmpv && unzip -o 30-l11v7.chunk07.zip -d tmpv && unzip -o 31-l11v7.chunk08.zip -d tmpv && unzip -o 32-l11v7.chunk09.zip -d tmpv && cat tmpv/l11v7.chunk00 tmpv/l11v7.chunk01 tmpv/l11v7.chunk02 tmpv/l11v7.chunk03 tmpv/l11v7.chunk04 tmpv/l11v7.chunk05 tmpv/l11v7.chunk06 tmpv/l11v7.chunk07 tmpv/l11v7.chunk08 tmpv/l11v7.chunk09 > public/v11-qz4m8k/lesson.mp4
      - run: sha256sum public/v11-qz4m8k/lesson.mp4 && ls -la public/v11-qz4m8k/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - run: sleep 30
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4







