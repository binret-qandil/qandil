<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--navy:#0E2A47;--navy2:#123C63;--gold:#D8A331;--gold2:#F2C14E;--paper:#F7F3E8;--ink:#1B2A38;--ok:#1E7D46;--bad:#B3362B;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--navy);color:var(--ink);min-height:100vh}
button{font-family:inherit}
#app{max-width:760px;margin:0 auto;padding:0 14px 90px}
.hero{text-align:center;padding:26px 10px 18px;color:#fff}
.hero img.logo{width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);background:var(--navy2)}
.hero h1{margin:10px 0 2px;font-size:30px;color:var(--gold2);letter-spacing:.5px}
.hero .sub{color:#cfe0f0;font-size:15px;margin:2px 0}
.hero .by{color:#9fb8cf;font-size:13px;margin-top:6px}
.stats{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.stats .chip{background:var(--navy2);color:#fff;border:1px solid #2a4f77;border-radius:14px;padding:8px 14px;font-size:14px}
.stats .chip b{color:var(--gold2)}
.menu{display:grid;gap:12px;margin-top:18px}
.mbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;text-align:right;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mbtn .ic{font-size:26px}
.mbtn small{display:block;font-weight:400;color:#5a6b7a;font-size:13px;margin-top:3px}
.mbtn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3d2c05}
h2.sec{color:#fff;font-size:20px;margin:22px 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lesson-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.lesson-head .t{font-weight:700;color:var(--navy);font-size:16px}
.lesson-head .n{color:#6b7c8a;font-size:13px}
.lesson-body{margin-top:10px;display:none}
.lesson.open .lesson-body{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{flex:1;min-width:200px;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--navy);cursor:pointer}
.pill .c{font-weight:400;color:#6b7c8a;font-size:12.5px}
.pill .best{color:var(--ok);font-size:12.5px;font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);padding:10px 0;display:flex;align-items:center;gap:10px}
.bar .back{background:var(--navy2);color:#fff;border:1px solid #2a4f77;border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer}
.bar .ttl{color:#fff;font-weight:700;font-size:15.5px;flex:1}
.timer{background:var(--navy2);border:1px solid #2a4f77;color:#fff;border-radius:10px;padding:6px 10px;font-size:15px;min-width:64px;text-align:center}
.timer.low{background:var(--bad);border-color:var(--bad)}
.qcard{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}
.qnum{color:var(--gold);font-weight:700;font-size:14px}
.qimg{margin:10px 0;background:#fff;border-radius:8px;overflow:hidden;text-align:center}
.qimg img{width:100%;height:auto;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opt{background:var(--paper);border:2px solid #cbb26a;border-radius:12px;padding:14px;font-size:20px;font-weight:700;color:var(--navy);cursor:pointer}
.opt.sel{background:var(--gold2);border-color:var(--navy)}
.opt.right{background:#d9f0e1;border-color:var(--ok)}
.opt.wrong{background:#f6dcda;border-color:var(--bad)}
.freein{display:flex;gap:8px;margin-top:8px}
.freein input{flex:1;font-size:18px;padding:12px;border-radius:12px;border:2px solid #cbb26a;background:var(--paper);text-align:center}
.btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3d2c05}
.btn.ghost{background:#e8eef4;color:var(--navy)}
.btnrow{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.feedback.ok{background:#d9f0e1;border:1.5px solid var(--ok)}
.feedback.bad{background:#f6dcda;border:1.5px solid var(--bad)}
.why{background:var(--paper);border:1.5px dashed var(--gold);border-radius:12px;padding:12px;margin-top:10px;font-size:15px}
.why b{color:var(--navy)}
.why .r{direction:rtl;margin-top:6px;line-height:1.9}
.prog{height:8px;background:#dfe6ec;border-radius:6px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--gold)}
.result{text-align:center;padding:26px 14px}
.result .big{font-size:44px;font-weight:800;color:var(--navy)}
.result .msg{font-size:18px;color:var(--navy);font-weight:700;margin-top:6px}
.review-item{border:1px solid #d8dee5;border-radius:12px;padding:10px;margin-top:10px}
.review-item .st{font-weight:700;font-size:14px}
.review-item .st.ok{color:var(--ok)}.review-item .st.bad{color:var(--bad)}
.review-item .ans{font-size:14px;margin-top:4px;color:#40525f}
.note{color:#9fb8cf;font-size:12.5px;text-align:center;margin-top:16px;line-height:1.9}
.foot{color:#7e96ac;text-align:center;font-size:13px;margin-top:26px;line-height:2}
.hidden{display:none}
.install{background:var(--navy2);border:1px solid #2a4f77;border-radius:14px;color:#dce8f3;padding:14px;font-size:14px;line-height:2;margin-top:18px}
.install b{color:var(--gold2)}
.center{text-align:center}
.spin{color:#fff;text-align:center;padding:40px;font-size:16px}
</style>

<body>
<div id="app"><div class="spin">جارٍ التحميل…</div></div>
<script src="../math.js"></script>
<script src="../scoring.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const letters=['أ','ب','ج','د'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPPORTED=['multiple_choice','number','ratio','percentage','symbolic','choice_set'];
let TOPICS=null;
const pageCache={};
async function loadPage(n){
  if(pageCache[n])return pageCache[n];
  const r=await fetch('../pages/'+n+'.json');
  if(!r.ok)throw new Error('page');
  const d=await r.json();
  d.questions=d.questions.filter(q=>SUPPORTED.includes(q.type));
  pageCache[n]=d;return d;
}
async function collect(pages){
  const out=[];
  for(const p of pages){const d=await loadPage(p);for(const q of d.questions)out.push({page:p,q});}
  return out;
}
/* ---------- persistent state ---------- */
const store={
  get(){try{return JSON.parse(localStorage.getItem('qandil-app-v1'))||{}}catch(e){return{}}},
  set(o){localStorage.setItem('qandil-app-v1',JSON.stringify(o))},
  patch(f){const o=store.get();f(o);store.set(o)}
};
function recordAnswer(ref,ok){
  store.patch(o=>{
    o.wrongs=o.wrongs||{};
    if(ok){delete o.wrongs[ref];}else{o.wrongs[ref]=Date.now();}
  });
}
function bestScore(id,score,total){
  store.patch(o=>{o.best=o.best||{};const b=o.best[id];if(!b||score>b.s)o.best[id]={s:score,t:total};});
}
function getBest(id){const b=(store.get().best||{})[id];return b?b:null}
/* ---------- session ---------- */
let SESS=null; // {mode,title,items:[{page,q}],timed:'q'|'total'|null,perQ:60,totalSec,answers:{i:val},checked:{i:bool},current,startQAt,endsAt}
let tick=null;
function stopTick(){if(tick){clearInterval(tick);tick=null;}}
function startTick(){stopTick();tick=setInterval(()=>{renderTimer();},500);}
function fmt(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;return ar(m)+':'+ar(String(ss).padStart(2,'0'));}
function remaining(){
  if(!SESS||!SESS.timed)return null;
  if(SESS.timed==='q')return Math.max(0,SESS.perQ-(Date.now()-SESS.startQAt)/1000);
  return Math.max(0,(SESS.endsAt-Date.now())/1000);
}
function renderTimer(){
  const el=$('#timer');if(!el||!SESS||!SESS.timed)return;
  const r=remaining();
  el.textContent=fmt(r);
  el.classList.toggle('low',r<=10);
  if(r<=0){onTimeUp();}
}
function onTimeUp(){
  if(SESS.timed==='q'){
    // close current question and move on
    if(SESS.current<SESS.items.length-1){goQ(SESS.current+1);}
    else{finish();}
  }else{finish();}
}
/* ---------- grading ---------- */
function grade(q,a){
  if(a===null||a===undefined||a==='')return null;
  try{return scoreAnswer(q,a);}catch(e){return null;}
}
function correctText(q){
  const s=q.answerSpec||{};
  if(q.type==='multiple_choice')return letters[(s.option_index_1based||1)-1];
  if(q.type==='choice_set')return (s.option_indices_1based||[]).map(i=>letters[i-1]).join('، ');
  return q.answerDisplay!=null?String(q.answerDisplay):'—';
}
/* ---------- views ---------- */

function barHTML(title,withTimer){
  return `<div class="bar"><button class="back" onclick="goBack()">رجوع</button><div class="ttl">${esc(title)}</div>${withTimer?'<div class="timer" id="timer"></div>':''}</div>`;
}
let BACK='#home';
function goBack(){stopTick();route(BACK);}
function home(){
  stopTick();BACK='#home';
  const t=TOPICS.totals;
  const wrongs=Object.keys(store.get().wrongs||{}).length;
  const resumed=store.get().session;
  view().innerHTML=header()+`
  <div class="stats">
    <span class="chip"><b>${ar(t.supported)}</b> سؤالًا</span>
    <span class="chip"><b>${ar(25)}</b> اختبار درس</span>
    <span class="chip"><b>${ar(26)}</b> درسًا</span>
  </div>
  <div class="menu">
    ${resumed?`<button class="mbtn gold" onclick="resume()"><span class="ic">▶️</span><span>متابعة آخر اختبار<small>أكمل من حيث توقفت</small></span></button>`:''}
    <button class="mbtn" onclick="route('#tests')"><span class="ic">📝</span><span>الاختبارات<small>اختبارات الدروس من المذكرة بوقت، دقيقة لكل سؤال</small></span></button>
    <button class="mbtn" onclick="route('#train')"><span class="ic">📚</span><span>تدريب حسب الدرس<small>بدون وقت، مع شرح سبب الإجابة فورًا</small></span></button>
    <button class="mbtn" onclick="startMock()"><span class="ic">⏱️</span><span>اختبار تجريبي شامل<small>${ar(25)} سؤالًا من كل الدروس في ${ar(25)} دقيقة</small></span></button>
    <button class="mbtn" onclick="route('#wrongs')"><span class="ic">🔁</span><span>مراجعة أخطائي<small>${wrongs?ar(wrongs)+' سؤالًا تحتاج مراجعة':'أخطاؤك السابقة تتجمع هنا للتدريب عليها'}</small></span></button>
  </div>
  <div class="install"><b>ثبّت التطبيق على جوالك:</b><br>أندرويد: افتح الرابط في Chrome ثم ⋮ ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br>آيفون: افتح الرابط في Safari ثم زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</div>
  <div class="note">تقدّمك ونتائجك محفوظة على جهازك فقط، بلا حساب ولا تسجيل دخول.</div>
  <div class="foot">القنديل في الكمي والرياضيات<br>أ/ أحمد عادل — للتواصل: 0575978083</div>`;
}
function lessonList(kind){ // kind: 'tests' | 'train'
  BACK=kind==='tests'?'#tests':'#train';
  let h=header()+barHTML(kind==='tests'?'اختبارات المذكرة':'التدريب حسب الدرس',false);
  for(const L of TOPICS.lessons){
    if(kind==='tests'&&!L.tests.length)continue;
    const items=kind==='tests'?L.tests.map((t,i)=>{
      const id='t'+L.id+'-'+i;const b=getBest(id);
      return `<button class="pill" onclick="startTest(${L.id},${i})"><span>${esc(t.name)}</span><span class="c">${ar(t.qCount)} سؤالًا${b?` · <span class="best">أفضل نتيجة ${ar(b.s)}/${ar(b.t)}</span>`:''}</span></button>`;
    }).join(''):`<button class="pill" onclick="startTrain(${L.id})"><span>تدريب: ${esc(L.name)}</span><span class="c">${ar(L.trainQ)} سؤالًا</span></button>`;
    h+=`<div class="card lesson ${L.tests.length<=1?'open':''}"><div class="lesson-head" onclick="this.parentElement.classList.toggle('open')"><span class="t">${ar(L.id)}. ${esc(L.name)}</span><span class="n">▾</span></div><div class="lesson-body"><div class="row">${items}</div></div></div>`;
  }
  view().innerHTML=h;
}
/* ---------- session starters ---------- */
async function startTest(lessonId,ti){
  view().innerHTML='<div class="spin">جارٍ تجهيز الاختبار…</div>';
  const L=TOPICS.lessons.find(x=>x.id===lessonId);
  const t=L.tests[ti];
  const items=await collect(t.pages);
  newSession({mode:'test',sid:'t'+lessonId+'-'+ti,title:t.name+' — '+L.name,items,timed:'q',perQ:60});
}
async function startTrain(lessonId){
  view().innerHTML='<div class="spin">جارٍ تجهيز التدريب…</div>';
  const L=TOPICS.lessons.find(x=>x.id===lessonId);
  const items=await collect(L.trainPages);
  newSession({mode:'train',sid:'l'+lessonId,title:'تدريب: '+L.name,items,timed:null});
}
async function startMock(){
  view().innerHTML='<div class="spin">جارٍ تجهيز اختبار تجريبي شامل…</div>';
  const allPages=[];
  for(const L of TOPICS.lessons){allPages.push(...L.trainPages);for(const t of L.tests)allPages.push(...t.pages);}
  const uniq=[...new Set(allPages)];
  const picked=[];const pool=[...uniq];
  while(picked.length<25&&pool.length){
    const p=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const d=await loadPage(p);
    if(d.questions.length)picked.push({page:p,q:d.questions[Math.floor(Math.random()*d.questions.length)]});
  }
  newSession({mode:'mock',sid:'mock',title:'اختبار تجريبي شامل',items:picked,timed:'total',totalSec:25*60});
}
async function startWrongs(){
  const w=Object.keys(store.get().wrongs||{});
  if(!w.length){view().innerHTML=header()+barHTML('مراجعة أخطائي',false)+'<div class="card center" style="margin-top:14px">لا توجد أخطاء مسجلة. أي سؤال تخطئ فيه يُحفظ هنا تلقائيًا لتتدرب عليه.</div>';return;}
  view().innerHTML='<div class="spin">جارٍ تجهيز مراجعة الأخطاء…</div>';
  const refs={};for(const r of w){const[p,qid]=r.split('|');(refs[p]=refs[p]||[]).push(qid);}
  let items=[];
  for(const p of Object.keys(refs)){const d=await loadPage(Number(p));for(const q of d.questions)if(refs[p].includes(q.id))items.push({page:Number(p),q});}
  if(!items.length){view().innerHTML=header()+barHTML('مراجعة أخطائي',false)+'<div class="card center" style="margin-top:14px">لا توجد أخطاء مسجلة حاليًا.</div>';return;}
  newSession({mode:'wrongs',sid:'wrongs',title:'مراجعة أخطائي',items,timed:null});
}
function newSession(s){
  stopTick();
  SESS=Object.assign({answers:{},checked:{},current:0},s);
  if(SESS.timed==='total')SESS.endsAt=Date.now()+SESS.totalSec*1000;
  SESS.startQAt=Date.now();
  persistSess();
  startTick();
  renderQ();
}
function persistSess(){
  // persist lightweight session (without big images) for resume
  const lite={mode:SESS.mode,sid:SESS.sid,title:SESS.title,timed:SESS.timed,perQ:SESS.perQ,totalSec:SESS.totalSec,answers:SESS.answers,checked:SESS.checked,current:SESS.current,refs:SESS.items.map(it=>({page:it.page,id:it.q.id}))};
  store.patch(o=>{o.session=lite;});
}
async function resume(){
  const lite=store.get().session;if(!lite)return;
  view().innerHTML='<div class="spin">جارٍ استئناف الاختبار…</div>';
  const byPage={};for(const r of lite.refs)(byPage[r.page]=byPage[r.page]||[]).push(r.id);
  let items=[];
  for(const p of Object.keys(byPage)){const d=await loadPage(Number(p));for(const q of d.questions)if(byPage[p].includes(q.id))items.push({page:Number(p),q});}
  const order=lite.refs.map(r=>r.page+'|'+r.id);
  items.sort((a,b)=>order.indexOf(a.page+'|'+a.q.id)-order.indexOf(b.page+'|'+b.q.id));
  SESS={mode:lite.mode,sid:lite.sid,title:lite.title,timed:lite.timed,perQ:lite.perQ,answers:lite.answers||{},checked:lite.checked||{},current:lite.current||0,items};
  if(SESS.timed==='total')SESS.endsAt=Date.now()+(lite.totalSec||1500)*1000;
  SESS.startQAt=Date.now();
  startTick();renderQ();
}
/* ---------- question rendering ---------- */
function goQ(i){SESS.current=i;SESS.startQAt=Date.now();persistSess();renderQ();window.scrollTo(0,0);}
function renderQ(){
  const it=SESS.items[SESS.current];const q=it.q;const i=SESS.current;
  const n=SESS.items.length;
  const checked=!!SESS.checked[i];
  const a=SESS.answers[i];
  let input='';
  if(q.type==='multiple_choice'){
    input='<div class="opts">'+letters.map((l,k)=>{
      let cls='opt';if(a===k)cls+=' sel';
      if(checked){const ok=grade(q,a);const right=(q.answerSpec.option_index_1based-1)===k;if(right)cls+=' right';else if(a===k)cls+=' wrong';}
      return `<button class="${cls}" data-k="${k}" ${checked?'disabled':''}>${l}</button>`;
    }).join('')+'</div>';
  }else if(q.type==='choice_set'){
    const sel=Array.isArray(a)?a:[];
    input='<div class="opts">'+letters.map((l,k)=>{
      let cls='opt'+(sel.includes(k)?' sel':'');
      return `<button class="${cls}" data-mk="${k}" ${checked?'disabled':''}>${l}</button>`;
    }).join('')+'</div><div class="note" style="color:#6b7c8a">اختر كل الإجابات الصحيحة ثم اضغط تأكيد</div>';
  }else{
    const hint=q.type==='ratio'?'مثال: 3:5 أو 0.6':q.type==='percentage'?'مثال: 25٪ أو 25':'اكتب الناتج';
    input=`<div class="freein"><input id="freev" inputmode="text" placeholder="${hint}" value="${a!=null?esc(a):''}" ${checked?'disabled':''}></div>`;
  }
  let fb='';
  if(checked){
    const ok=grade(q,a);
    fb=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'إجابة صحيحة ✅':'إجابة غير صحيحة ❌'}</b> — الإجابة الصحيحة: <b>${esc(correctText(q))}</b></div>`;
    if(q.reason)fb+=`<div class="why"><b>لماذا؟</b><div class="r">${esc(q.reason)}</div></div>`;
    else if(q.answerDisplay!=null&&q.type!=='multiple_choice')fb+=`<div class="why"><b>الناتج:</b> ${esc(q.answerDisplay)}</div>`;
  }
  const trainMode=!SESS.timed;
  view().innerHTML=barHTML(SESS.title,!!SESS.timed)+`
  <div class="prog"><i style="width:${Math.round((i)/n*100)}%"></i></div>
  <div class="qcard">
    <div class="qnum">سؤال ${ar(i+1)} من ${ar(n)} · صفحة ${ar(it.page)} من المذكرة</div>
    <div class="qimg"><img src="${q.readerImage||q.image}" alt="السؤال"></div>
    ${input}
    ${fb}
    <div class="btnrow">
      ${!checked?`<button class="btn gold" id="confirm">تأكيد الإجابة</button>`:''}
      ${checked||!trainMode?(i<n-1?`<button class="btn" id="nextq">السؤال التالي</button>`:`<button class="btn gold" id="finish">إنهاء وعرض النتيجة</button>`):''}
      ${trainMode&&!checked?`<button class="btn ghost" id="skipq">تخطَّ</button>`:''}
    </div>
  </div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SESS.answers[i]=Number(b.dataset.k);if(SESS.timed){confirmAnswer();}else{renderQ();}});
  document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const k=Number(b.dataset.mk);let arr=Array.isArray(SESS.answers[i])?[...SESS.answers[i]]:[];arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];SESS.answers[i]=arr;renderQ();});
  const cf=$('#confirm');if(cf)cf.onclick=confirmAnswer;
  const nx=$('#nextq');if(nx)nx.onclick=()=>goQ(i+1);
  const fn=$('#finish');if(fn)fn.onclick=finish;
  const sk=$('#skipq');if(sk)sk.onclick=()=>goQ(Math.min(i+1,n-1));
  const fi=$('#freev');if(fi){fi.addEventListener('keydown',e=>{if(e.key==='Enter')confirmAnswer();});}
  if(SESS.timed)renderTimer();
}
function confirmAnswer(){
  const i=SESS.current;const q=SESS.items[i].q;
  if(q.type!=='multiple_choice'&&q.type!=='choice_set'){const fi=$('#freev');if(fi)SESS.answers[i]=fi.value;}
  if(SESS.answers[i]===undefined||SESS.answers[i]===''||(Array.isArray(SESS.answers[i])&&!SESS.answers[i].length))return;
  if(!SESS.timed){
    SESS.checked[i]=true;
    const ok=grade(q,SESS.answers[i]);
    recordAnswer(SESS.items[i].page+'|'+q.id,!!ok);
    if(SESS.mode==='train'||SESS.mode==='wrongs'){
      store.patch(o=>{o.tp=o.tp||{};const k=SESS.sid;o.tp[k]=o.tp[k]||{a:0,c:0};o.tp[k].a++;if(ok)o.tp[k].c++;});
    }
  }else{
    SESS.checked[i]=true;
    recordAnswer(SESS.items[i].page+'|'+q.id,!!grade(q,SESS.answers[i]));
    // timed: auto-advance after short pause
    persistSess();
    setTimeout(()=>{if(SESS&&SESS.current===i){if(i<SESS.items.length-1)goQ(i+1);else finish();}},650);
    return;
  }
  persistSess();renderQ();
}
function finish(){
  stopTick();
  const n=SESS.items.length;let score=0;const rows=[];
  SESS.items.forEach((it,i)=>{
    const a=SESS.answers[i];
    const ok=grade(it.q,a)===true;
    if(ok)score++;
    rows.push({i,it,a,ok});
  });
  if(SESS.mode==='test')bestScore(SESS.sid,score,n);
  store.patch(o=>{delete o.session;});
  const pct=n?score/n:0;
  const msg=pct>=.9?'ممتاز! نتيجة رائعة':pct>=.75?'جيد جدًا، قريب من التمام':pct>=.5?'جيد، راجع أخطاءك وستتحسن':'تحتاج تدريبًا أكثر على هذا الدرس';
  let h=barHTML('النتيجة — '+SESS.title,false);
  h+=`<div class="card result"><div class="big">${ar(score)} / ${ar(n)}</div><div class="msg">${msg}</div><div style="color:#6b7c8a;margin-top:6px">${ar(Math.round(pct*100))}٪</div>
  <div class="btnrow"><button class="btn gold" onclick="route('#tests')">الاختبارات</button><button class="btn" onclick="route('#wrongs');startWrongs()">راجع أخطاءك</button><button class="btn ghost" onclick="route('#home')">الرئيسية</button></div></div>`;
  h+='<h2 class="sec">مراجعة الأسئلة</h2>';
  for(const r of rows){
    h+=`<div class="card review-item"><div class="st ${r.ok?'ok':'bad'}">${r.ok?'✅':'❌'} سؤال ${ar(r.i+1)} — صفحة ${ar(r.it.page)}</div>
    <div class="qimg"><img loading="lazy" src="${r.it.q.readerImage||r.it.q.image}"></div>
    <div class="ans">إجابتك: <b>${esc(respLabel(r.it.q,r.a))}</b> · الصحيح: <b>${esc(correctText(r.it.q))}</b></div>
    ${r.it.q.reason?`<div class="why"><b>لماذا؟</b><div class="r">${esc(r.it.q.reason)}</div></div>`:''}
    </div>`;
  }
  view().innerHTML=h;window.scrollTo(0,0);
}
function respLabel(q,a){
  if(a===undefined||a===null||a==='')return 'بدون إجابة';
  if(q.type==='multiple_choice')return letters[a]??'—';
  if(q.type==='choice_set')return Array.isArray(a)?a.map(i=>letters[i]).join('، '):'—';
  return String(a);
}
