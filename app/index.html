<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--navy:#0E2A47;--navy2:#123C63;--gold:#D8A331;--gold2:#F2C14E;--paper:#F7F3E8;--ink:#1B2A38;--ok:#1E7D46;--bad:#B3362B;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--navy);color:var(--ink);min-height:100vh}
button{font-family:inherit}
#app{max-width:760px;margin:0 auto;padding:0 14px 90px}
.hero{text-align:center;padding:26px 10px 18px;color:#fff}
.hero img.logo{width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);background:var(--navy2)}
.hero h1{margin:10px 0 2px;font-size:30px;color:var(--gold2);letter-spacing:.5px}
.hero .sub{color:#cfe0f0;font-size:15px;margin:2px 0}
.hero .by{color:#9fb8cf;font-size:13px;margin-top:6px}
.stats{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.stats .chip{background:var(--navy2);color:#fff;border:1px solid #2a4f77;border-radius:14px;padding:8px 14px;font-size:14px}
.stats .chip b{color:var(--gold2)}
.menu{display:grid;gap:12px;margin-top:18px}
.mbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;text-align:right;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mbtn .ic{font-size:26px}
.mbtn small{display:block;font-weight:400;color:#5a6b7a;font-size:13px;margin-top:3px}
.mbtn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3d2c05}
h2.sec{color:#fff;font-size:20px;margin:22px 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lesson-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.lesson-head .t{font-weight:700;color:var(--navy);font-size:16px}
.lesson-head .n{color:#6b7c8a;font-size:13px}
.lesson-body{margin-top:10px;display:none}
.lesson.open .lesson-body{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{flex:1;min-width:200px;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--navy);cursor:pointer}
.pill .c{font-weight:400;color:#6b7c8a;font-size:12.5px}
.pill .best{color:var(--ok);font-size:12.5px;font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);padding:10px 0;display:flex;align-items:center;gap:10px}

.foot{color:#7e96ac;text-align:center;font-size:13px;margin-top:26px;line-height:2}

م","الباقي = ١٢٥ − ١٠٤ = ٢١ م","الإجابة: د (٢١)"]},"p281-q05":{"s":["مساحة الأرض = ٨٠ × ٤٠ = ٣٢٠٠ م{^٢}","عدد الأشخاص = ٣٢٠٠ × ٤ = ١٢٨٠٠","الإجابة: ج (١٢٨٠٠)"]},"p281-q06":{"s":["الطول + العرض = ٤٠ ÷ ٢ = ٢٠","الطول × العرض = ٩٩","العددان ١١ و ٩ (١١ + ٩ = ٢٠ و ١١ × ٩ = ٩٩)","الإجابة: أ (١١ ، ٩)"]},"p282-q01":{"s":["الطول + العرض = ٣٤ ÷ ٢ = ١٧","الطول × العرض = ٥٢","العددان ١٣ و ٤ (١٣ + ٤ = ١٧ و ١٣ × ٤ = ٥٢)","الطول = ١٣ م","الإجابة: أ (١٣)"]},"p282-q02":{"s":["العرض ع والطول ع + ٢","مربع القطر = ع × ع + (ع + ٢) × (ع + ٢) = ١٠٠","٢ × ع × ع + ٤ × ع + ٤ = ١٠٠ ← ع × ع + ٢ × ع − ٤٨ = ٠","(ع − ٦)(ع + ٨) = ٠ ← ع = ٦ والطول = ٨","مساحة المستطيل = ٨ × ٦ = ٤٨ سم{^٢}","القيمة الثانية = ٢٤ ← ٤٨ > ٢٤ ← القيمة الأولى أكبر","الإجابة: أ"]},"p283-q01":{"s":["الشكل ٥ مربعات متلاصقة في صف واحد","المحيط يتكون من ١٢ ضلعا: ٥ في الأعلى و ٥ في الأسفل وضلعان جانبيان","١٢ × ضلع المربع = ٧٢","ضلع المربع = ٧٢ ÷ ١٢ = ٦","الإجابة: ب (٦)"]},"p283-q02":{"s":["نفرض ضلع المربع س","المساحة = س × س ، المحيط = ٤ × س","س × س = ٢ × (٤ × س)","س × س = ٨ × س ← س = ٨","المحيط = ٤ × ٨ = ٣٢","الإجابة: د (٣٢)"]},"p283-q04":{"s":["ضلع المربع الأول = ٤ لأن ٤ × ٤ = ١٦ ، وضلع الثاني = ٣ لأن ٣ × ٣ = ٩","قطر المربع = الضلع × {sqrt:٢}","الفرق بين القطرين = (٤ − ٣) × {sqrt:٢} = {sqrt:٢}","{sqrt:٢} أقل من ٢ لأن ١ × ١ = ١ و ٢ × ٢ = ٤ ← القيمة الثانية أكبر","الإجابة: ب"]},"p283-q05":{"s":["القيمة الأولى: مساحة مثلث متطابق الأضلاع ضلعه ٤","المساحة = ({sqrt:٣} × ٤ × ٤) ÷ ٤ = ٤{sqrt:٣}","٤{sqrt:٣} ≈ ٤ × ١٫٧٣ = ٦٫٩٣ سم{^٢}","القيمة الثانية: ٣ × ٣ = ٩ سم{^٢}","٩ > ٦٫٩٣ ← القيمة الثانية أكبر","الإجابة: ب"]},"p284-q01":{"s":["محيط المربع = ٢٠ ← الضلع = ٢٠ ÷ ٤ = ٥ م","المساحة = ٥ × ٥ = ٢٥ م{^٢}","القيمة الثانية = ٢٠ م{^٢}","٢٥ > ٢٠ ← القيمة الأولى أكبر","الإجابة: أ"]},"p284-q03":{"s":["محيط المربع الأول = ٤ × ٢ = ٨ سم","القيمة الأولى = ٤ × ٨ = ٣٢","محيط المربع الثاني = ٤ × ٧ = ٢٨","٣٢ > ٢٨ ← القيمة الأولى أكبر","الإجابة: أ"]},"p284-q04":{"s":["المربع له أربعة أضلاع متساوية طول كل منها ن","المحيط = ٤ × ن","الإجابة: د (٤ن)"]},"p285-q01":{"s":["محيط المربع = ٤٠ ← الضلع = ٤٠ ÷ ٤ = ١٠","المربع مقسوم إلى ٥ مستطيلات متطابقة طولها ١٠ وعرضها ١٠ ÷ ٥ = ٢","مساحة المستطيل الواحد = ١٠ × ٢ = ٢٠","الإجابة: أ (٢٠)"]},"p286-q02":{"s":["أ ب ج د مربع ← زاوية د = ٩٠{deg}","القطر أ ج ينصف زاوية أ ← ص = ٩٠ ÷ ٢ = ٤٥{deg}","س + ص = ٩٠ + ٤٥ = ١٣٥{deg}","الإجابة: ج (١٣٥)"]},"p286-q03":{"s":["محيط المثلث = ٧ + ٨ + ٩ = ٢٤ سم","محيط المربع = ٢٤ ← الضلع = ٢٤ ÷ ٤ = ٦ سم","القيمة الأولى ٦ والثانية ٨","٨ > ٦ ← القيمة الثانية أكبر","الإجابة: ب"]},"p287-q01":{"s":["زاوية المربع ٩٠{deg} مقسمة بالشعاعين إلى ثلاث زوايا متساوية ص","٣ × ص = ٩٠ ← ص = ٣٠{deg}","المثلث الأعلى: زاوية الرأس ٣٠{deg} وزاوية المربع ٩٠{deg} ← الزاوية الثالثة = ٦٠{deg}","س تكمل هذه الزاوية إلى مستقيم: س = ١٨٠ − ٦٠ = ١٢٠{deg}","الإجابة: أ (١٢٠)"]},"p287-q02":{"s":["شكل الدوار: أربعة مستطيلات متطابقة حول مربع صغير","الضلع الخارجي ٢٤ = الطول + العرض","أحد البعدين ١٠ ← البعد الآخر = ٢٤ − ١٠ = ١٤","ضلع المربع الصغير = ١٤ − ١٠ = ٤","المساحة = ٤ × ٤ = ١٦","الإجابة: ج (١٦)"]},"p287-q03":{"s":["محيط الأرض = ٤ × ٢٦ = ١٠٤ م","الباقي = ١٢٥ − ١٠٤ = ٢١ م","الإجابة: أ (٢١)"]},"p287-q04":{"s":["نصف المحيط = ٤٨ ÷ ٢ = ٢٤ ← الطول + العرض = ٢٤","الطول − ٢ = العرض + ٢ ← الطول − العرض = ٤","الطول = (٢٤ + ٤) ÷ ٢ = ١٤ ، العرض = ١٠","ضلع المربع الجديد = ١٤ − ٢ = ١٢","المساحة = ١٢ × ١٢ = ١٤٤","الإجابة: أ (١٤٤)"]},"p288-q01":{"s":["قطر المربع = الضلع × {sqrt:٢}","الضلع × {sqrt:٢} = ٥{sqrt:٢} ← الضلع = ٥","المحيط = ٤ × ٥ = ٢٠","الإجابة: ب (٢٠)"]},"p288-q03":{"s":["نفرض ضلع المربع س فمساحته س × س","الضلع الجديد = ٤س فالمساحة الجديدة = ٤س × ٤س = ١٦ × (س × س)","الزيادة = ١٦ − ١ = ١٥ مثل المساحة الأصلية","نسبة الزيادة = ١٥ × ١٠٠٪ = ١٥٠٠٪","الإجابة: ب (١٥٠٠٪)"]},"p288-q04":{"s":["مساحة الغرفة = ٢٠٠ × ٣٠٠ = ٦٠٠٠٠ سم{^٢} (٢ م = ٢٠٠ سم ، ٣ م = ٣٠٠ سم)","مساحة البلاطة = ٢٥ × ٢٥ = ٦٢٥ سم{^٢}","العدد = ٦٠٠٠٠ ÷ ٦٢٥ = ٩٦","الإجابة: ب (٩٦)"]},"p289-q01":{"s":["المثلث القائم: وتر ٥ وضلع ٣ ← الضلع الآخر = ٤ (الأعداد ٣ و ٤ و ٥)","هذا الضلع هو ضلع المربع أ ب ج د","مساحة المربع = ٤ × ٤ = ١٦ سم{^٢}","القيمة الثانية = ١٥ ← ١٦ > ١٥ ← القيمة الأولى أكبر","الإجابة: أ"]},"p289-q02":{"s":["مساحة المربع الواحد = ٩٩ ÷ ١١ = ٩ ← ضلعه ٣ سم","الشكل مستطيل ٤ × ٣ مربعات ينقصه مربع في ركن","محيط الشكل = محيط المستطيل ٤ × ٣ مربعات = ٢ × (١٢ + ٩) = ٤٢","الإجابة: أ (٤٢)"]},"p290-q01":{"s":["مساحة المربع الواحد = ٢٠٠ ÷ ٨ = ٢٥ ← الضلع = ٥ سم","عدد الأضلاع على المحيط: ٨ × ٤ = ٣٢ ناقص ٢ لكل ضلع مشترك","عدد الأضلاع المشتركة = ٨ ← ٣٢ − ١٦ = ١٦ ضلعا","المحيط = ١٦ × ٥ = ٨٠ سم","الإجابة: ج (٨٠)"]},"p290-q03":{"s":["المثلث قاعدته الضلع السفلي للمستطيل = ١٢ وارتفاعه = ٣ (رأسه على الضلع العلوي)","المساحة = {frac:١|٢} × ١٢ × ٣ = ١٨","الإجابة: ج (١٨)"]},"p291-q01":{"s":["المثلث في المستطيل: {frac:١|٢} × ٤ × ٩ = ١٨","المثلث في المربع: {frac:١|٢} × ٦ × ٦ = ١٨","القيمتان متساويتان","الإجابة: ج"]},"p291-q02":{"s":["التظليل يظهر داخل المثلث فقط","رأسا القاعدة لا يصلان إلى ركني المستطيل","المثلث ارتفاعه = ارتفاع المستطيل وقاعدته أقل من عرضه","مساحة المثلث = {frac:١|٢} × القاعدة × الارتفاع","هذه أقل من {frac:١|٢} × العرض × الارتفاع = نصف المستطيل","المظلل أقل من نصف المستطيل ← غير المظلل أكبر","الإجابة: ب (القيمة الثانية أكبر)"]},"p294-q01":{"s":["مساحة المربع الواحد = ٤ ← ضلعه ٢ سم","المثلث المظلل قاعدته ضلع مربع = ٢ سم","ارتفاعه نصف ضلع المربع = ١ سم (الخط يصل منتصف الضلع بالركن)","المساحة = {frac:١|٢} × ٢ × ١ = ١ سم{^٢}","١ < ٢ ← القيمة الثانية أكبر","الإجابة: ب"]},"p294-q02":{"s":["ضلع المربع = {sqrt:٤٩} = ٧ سم","القيمة الأولى ٧ والثانية ٧","متساويتان","الإجابة: ج"]},"p295-q01":{"s":["المثلث قائم والمربعات على أضلاعه","مساحة المربع ٣ على الوتر = مجموع مساحتي المربعين الآخرين","٥ = ٤ + مساحة المربع ٢","مساحة المربع ٢ = ٥ − ٤ = ١ سم{^٢}","الإجابة: أ (١)"]},"p295-q02":{"s":["عدد البلاط على العرض = ٢ ÷ ٠٫٢٥ = ٨","عدد البلاط على الطول = ٣ ÷ ٠٫٢٥ = ١٢","العدد = ٨ × ١٢ = ٩٦","٩٦ > ٨٤ ← القيمة الأولى أكبر","الإجابة: أ"]},"p296-q01":{"s":["أ ب ج مثلث و ه منتصف ب أ (علامتا التساوي) ← ب أ = ٢ × ب ه","ب د ج ه مربع ← ج ه = ب ه = ضلع المربع س","مساحة المثلث = {frac:١|٢} × (٢ × س) × س = س × س","س × س = ١٠٠","مساحة المربع = ١٠٠ سم{^٢}","الإجابة: ب (١٠٠)"]},"p297-q01":{"s":["المربعان متساويان ضلع كل منهما ٥ سم ويتلامسان في نقطة","لا تضيع أضلاع بالتلاصق لأنه في نقطة واحدة","المحيط = ٢ × (٤ × ٥) = ٤٠ سم","الإجابة: د (٤٠)"]},"p297-q02":{"s":["مستقيمان رأسيان متوازيان يقطعهما القاطع المائل","زاويتا س و ٦٠{deg} داخليتان في جهة واحدة من القاطع (متحالفتان) فمجموعهما ١٨٠{deg}","س = ١٨٠ − ٦٠ = ١٢٠{deg}","الإجابة: د (١٢٠)"]},"p298-q02":{"s":["محيط المربع ١٦ ← الضلع = ١٦ ÷ ٤ = ٤","مساحة المربع = ٤ × ٤ = ١٦","المستطيلان متطابقان فمساحة الواحد = ١٦ ÷ ٢ = ٨","الإجابة: أ (٨)"]},"p299-q01":{"s":["مساحة المعين = {frac:١|٢} × حاصل ضرب القطرين","{frac:١|٢} × ٦ × ٨ = ٢٤ سم{^٢}","الإجابة: ب (٢٤)"]},"p299-q02":{"s":["قطرا المعين متعامدان وينصف كل منهما الآخر","نصف القطر المعلوم = ١٢ ÷ ٢ = ٦","المثلث القائم: وتر ١٠ وضلع ٦","مربع نصف القطر الآخر = (١٠ × ١٠) − (٦ × ٦) = ٦٤ ← نصف القطر الآخر = ٨","القطر الآخر = ٨ × ٢ = ١٦","الإجابة: ج (١٦)"]},"p300-q01":{"s":["زاويتان متجاورتان في المعين مجموعهما ١٨٠{deg}","٢س + ٣س = ١٨٠","٥س = ١٨٠ ← س = ٣٦","زاوية د تقابل زاوية ب فتساويها = ٣س","٣ × ٣٦ = ١٠٨{deg}","الإجابة: ج (١٠٨)"]},"p301-q01":{"s":["نصفا القطرين ٣ و ٤","مربع ضلع المعين = (٣ × ٣) + (٤ × ٤) = ٢٥ ← الضلع = ٥","محيط المعين = ٤ × ٥ = ٢٠ سم","المربع مساحته ٢٥ ← ضلعه ٥ ← محيطه ٢٠ سم","القيمتان متساويتان","الإجابة: ج"]},"p301-q02":{"s":["ب ج ∥ أ ص و ب ج = ب س (العلامتان) ← مثلث ب ج س متساوي الساقين","زاوية ص = زاوية ب ج س = زاوية س ← أ ص = أ س = ١٥","أ ب + ب س = ١٥ و ب ج = ب س","أ ب + ب ج = ١٥","المحيط = ٢ × (أ ب + ب ج) = ٢ × ١٥ = ٣٠ سم","الإجابة: ب (٣٠)"]},"p301-q03":{"s":["مساحة المستطيل = ٥ × ٤ = ٢٠","في متوازي الأضلاع القاعدة ٤ والضلع المائل ٥","الارتفاع هو الضلع القائم في المثلث الذي وتره ٥ فهو أصغر من ٥ (الارتفاع < ٥)","مساحة المتوازي = ٤ × الارتفاع < ٤ × ٥ = ٢٠","القيمة الأولى أكبر","الإجابة: أ"]},"p302-q01":{"s":["زاوية المتوازي المقابلة للزاوية ١١٠{deg} مجاورة لها: ١٨٠ − ١١٠ = ٧٠{deg}","الخط الداخلي يوازي الضلع الأيسر ← الزاوية عند القاعدة = ٧٠{deg}","المثلث الأيمن متساوي الساقين (العلامتان)","زاويتا القاعدة ٧٠{deg} و ٧٠{deg}","س = ١٨٠ − (٧٠ + ٧٠) = ٤٠{deg}","الإجابة: ج (٤٠)"]},"p302-q02":{"s":["أ ب = ٢ و ه منتصفه (العلامتان) ← ب ه = ١","و ه ∥ ج ب والمسافة بينهما ١ ← ج و ه ب شبه منحرف","و على القطر أ ج ← و ه = ١ (مثلث متشابه) وقاعدته ج ب = ٢","المساحة = {frac:١|٢} × (٢ + ١) × ١ = ١٫٥ سم{^٢}","الإجابة: أ (١٫٥)"]},"p303-q01":{"s":["الارتفاعات الأربعة للمنحرفات متساوية والمربع الداخلي (٥) مشترك","كل منحرف قاعدتاه ضلع المربع الكبير وضلع المربع الداخلي ← مساحاته الأربعة متساوية","القيمة الأولى = ١ + ٢ + ٥ والثانية = ٣ + ٤ + ٥","١ = ٢ = ٣ = ٤ ← القيمتان متساويتان","الإجابة: ج"]},"p304-q01":{"s":["نضع أ عند ٠ ← د عند ٢٤ (أ د = ٢٤)","ب عند ١٨ (أ ب = ١٨) ← ج عند ٢٤ − ١٤ = ١٠ (د ج = ١٤)","الترتيب أ ، ج ، ب ، د صحيح","ب ج = ١٨ − ١٠ = ٨","الإجابة: ب (٨)"]},"p305-q01":{"s":["الأضلاع تتصل بمنتصفات الأضلاع فكل مربع داخلي مساحته نصف مساحة الذي يحويه","المربع الصغير: ٢ × ٢ = ٤","المربع المتوسط = ٢ × ٤ = ٨","المربع الكبير = ٢ × ٨ = ١٦ سم{^٢}","الإجابة: ب (١٦)"]},"p305-q02":{"s":["المثلث الكبير مساحته ٦٤ ويقسم بمنتصفات أضلاعه إلى ٤ مثلثات متطابقة","مساحة كل منها = ٦٤ ÷ ٤ = ١٦","كل مثلث من الأركان الثلاثة يقسم مرة أخرى إلى ٤ ← مساحة الصغير = ١٦ ÷ ٤ = ٤","المظلل ٣ مثلثات صغيرة = ٣ × ٤ = ١٢","الإجابة: د (١٢)"]},"p307-q01":{"s":["ارتفاع شبه المنحرف = ٢ + ٦ = ٨","مساحته = {frac:١|٢} × (٣ + ٩) × ٨ = ٤٨","المثلث العلوي الأبيض = {frac:١|٢} × ٣ × ٢ = ٣","المثلث السفلي الأبيض = {frac:١|٢} × ٩ × ٦ = ٢٧","المظلل = ٤٨ − (٣ + ٢٧) = ١٨","الإجابة: أ (١٨)"]},"p307-q02":{"s":["المربع طول ضلعه ٤ مقسوم إلى ٤ مربعات طول ضلع كل منها ٢","المظلل شبه منحرف: قاعدتاه ٤ و ٢ وارتفاعه ٢","المساحة = {frac:١|٢} × (٤ + ٢) × ٢ = ٦ سم{^٢}","٦ < ٧ ← القيمة الثانية أكبر","الإجابة: ب"]},"p308-q01":{"s":["الشكل مقسوم إلى ٦ مربعات صغيرة كل منها ٢ × ٢ = ٤ فمساحة كل مثلث ٢","المظلل شبه منحرف: قاعدتاه ٦ و ٢ وارتفاعه ٢","المساحة = {frac:١|٢} × (٦ + ٢) × ٢ = ٨","٨ < ٩ ← القيمة الثانية أكبر","الإجابة: ب"]},"p309-q01":{"s":["الشكل مقسوم إلى ٤ مستطيلات متطابقة بالقطرين","قطر المستطيل يقسمه إلى مثلثين متساويين المساحة ← المظلل نصف كل مستطيل","نسبة المظلل = {frac:١|٢} = ٥٠٪","الإجابة: أ (٥٠٪)"]},"p310-q02":{"s":["كل مثلث مظلل هو نصف ربع المربع = {frac:١|٨} من مساحة المربع","مثلثان ← المظلل = {frac:٢|٨} = {frac:١|٤} المربع","{frac:١|٤} × المساحة = ٣ ← المساحة = ٣ × ٤","المساحة = ١٢ سم{^٢}","الإجابة: أ (١٢)"]}};
const HAS_SOLUTION=q=>!!STEP_SOL[q.id];
function stepHTML(t){
  t=esc(t);
  t=t.replace(/\{frac:([^|}]*)\|([^}]*)\}/g,'<span class="fr"><span class="n">$1</span><span class="d">$2</span></span>');
  t=t.replace(/\{\^([^}]*)\}/g,'<span class="ex">$1</span>');

function fmtReason(r){
  if(!r)return '';
  const raw=String(r).trim();
  return raw.split(/;\s*/).map(step=>{
    let t=esc(step);
    for(const[a,b]of RE_PHRASES)t=t.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),b);
    t=t.replace(/\bsqrt\s*\(([^)]*)\)/g,'√($1)');
    t=t.replace(/\bsqrt\s*(\d+(?:\.\d+)?)/g,'√$1');
    t=t.replace(/-&gt;/g,' ← ');
    t=t.replace(/\*/g,'×').replace(/\^2/g,'²').replace(/\^3/g,'³');
    t=t.replace(/[a-zA-Z]{2,}/g,w=>RE_WORDS[w.toLowerCase()]||w);
    t=t.replace(/\d+(\.\d+)?/g,m=>ar(m).replace(/\./g,'٫'));
    return t;
  }).join('<br>');
}

const pageCache={};
async function loadPage(n){
  if(pageCache[n])return pageCache[n];
  let d;
  try{
    const r=await fetch('../pages/'+n+'.json');
    if(!r.ok)throw new Error('page');
    d=await r.json();
  }catch(err){
    const c=await caches.open('qandil-pages-v1');const hit=await c.match('../pages/'+n+'.json');
    if(!hit)throw err;
    d=await hit.json();
  }
  d.questions.forEach(q=>{if(STEP_SOL[q.id]&&STEP_SOL[q.id].k!=null){q.correct=String(STEP_SOL[q.id].k);q.answerSpec=Object.assign({},q.answerSpec,{option_index_1based:STEP_SOL[q.id].k+1});q.answerDisplay=['أ','ب','ج','د'][STEP_SOL[q.id].k];}});
  d.questions=d.questions.filter(q=>SUPPORTED.includes(q.type)&&!EXCLUDED_Q.has(q.id)&&HAS_SOLUTION(q));
  pageCache[n]=d;return d;
}
async function collect(pages){
  const out=[];
  for(const p of pages){if(!OFFLINE_PAGES.includes(p))continue;const d=await loadPage(p);for(const q of d.questions)out.push({page:p,q});}
  return out;
}

function recordAnswer(ref,ok,chosen){
  store.patch(o=>{

      if(o.wrongs[ref]!==undefined){const w=normW(o.wrongs[ref]);w.corrected=true;w.ct=Date.now();o.wrongs[ref]=w;}
    }else{
      const w=normW(o.wrongs[ref]);

      o.wrongs[ref]=w;
    }
  });
}

function fmt(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;return ar(m)+':'+ar(String(ss).padStart(2,'0'));}
function remaining(){
  if(!SESS||!SESS.timed)return null;
  if(SESS.timed==='q')return Math.max(0,SESS.perQ-(Date.now()-SESS.startQAt)/1000);
  return Math.max(0,(SESS.endsAt-Date.now())/1000);
}
function renderTimer(){
  const el=$('#timer');if(!el||!SESS||!SESS.timed)return;
  const r=remaining();
  el.textContent=fmt(r);
  el.classList.toggle('low',r<=10);
  if(r<=0){onTimeUp();}
}
function onTimeUp(){
  if(SESS.timed==='q'){
    // lock any in-progress selection, then close the question and move on
    if(!SESS.checked[SESS.current])confirmAnswer();
    if(SESS.current<SESS.items.length-1){goQ(SESS.current+1);}
    else{finish();}
  }else{finish();}
}

function lessonList(kind){ // kind: 'tests' | 'train'
  BACK=kind==='tests'?'#tests':'#train';
  let h=header()+barHTML(kind==='tests'?'اختبارات المذكرة':'التدريب حسب الدرس',false);
  for(const L of TOPICS.lessons){
    if(kind==='tests'&&!L.tests.length)continue;
    const items=kind==='tests'?L.tests.map((t,i)=>{
      const id='t'+L.id+'-'+i;const b=getBest(id);
      return `<button class="pill" onclick="startTest(${L.id},${i})"><span>${esc(t.name)}</span><span class="c">${ar(t.qCount)} سؤالًا${b?` · <span class="best">أفضل نتيجة ${ar(b.s)}/${ar(b.t)}</span>`:''}</span></button>`;
    }).join(''):`<button class="pill" onclick="startTrain(${L.id})"><span>تدريب: ${esc(L.name)}</span><span class="c">${ar(L.trainQ)} سؤالًا</span></button>`;
    h+=`<div class="card lesson ${L.tests.length<=1?'open':''}"><div class="lesson-head" onclick="this.parentElement.classList.toggle('open')"><span class="t">${ar(L.id)}. ${esc(L.name)}</span><span class="n">▾</span></div><div class="lesson-body"><div class="row">${items}</div></div></div>`;
  }
  view().innerHTML=h;
}
/* ---------- session starters ---------- */
async function startTest(lessonId,ti){
  view().innerHTML='<div class="spin">جارٍ تجهيز الاختبار…</div>';
  const L=TOPICS.lessons.find(x=>x.id===lessonId);
  const t=L.tests[ti];
  const items=await collect(t.pages);
  newSession({mode:'test',sid:'t'+lessonId+'-'+ti,title:t.name+' — '+L.name,items,timed:'q',perQ:60});
}
async function startTrain(lessonId){
  view().innerHTML='<div class="spin">جارٍ تجهيز التدريب…</div>';
  const L=TOPICS.lessons.find(x=>x.id===lessonId);
  const items=await collect(L.trainPages);
  newSession({mode:'train',sid:'l'+lessonId,title:'تدريب: '+L.name,items,timed:null});
}
async function startMock(){
  view().innerHTML='<div class="spin">جارٍ تجهيز اختبار تجريبي شامل…</div>';
  const allPages=[];
  for(const L of TOPICS.lessons){allPages.push(...L.trainPages);for(const t of L.tests)allPages.push(...t.pages);}
  const uniq=[...new Set(allPages)].filter(p=>OFFLINE_PAGES.includes(p));
  const picked=[];const pool=[...uniq];
  while(picked.length<25&&pool.length){
    const p=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const d=await loadPage(p);
    if(d.questions.length)picked.push({page:p,q:d.questions[Math.floor(Math.random()*d.questions.length)]});
  }
  newSession({mode:'mock',sid:'mock',title:'اختبار تجريبي شامل',items:picked,timed:'total',totalSec:25*60});
}
async function startWrongs(){
  const w=Object.keys(store.get().wrongs||{});
  if(!w.length){view().innerHTML=header()+barHTML('مراجعة أخطائي',false)+'<div class="card center" style="margin-top:14px">لا توجد أخطاء مسجلة. أي سؤال تخطئ فيه يُحفظ هنا تلقائيًا لتتدرب عليه.</div>';return;}
  view().innerHTML='<div class="spin">جارٍ تجهيز مراجعة الأخطاء…</div>';
  const W=store.get().wrongs||{};
  const refs={};for(const r of w){const[p,qid]=r.split('|');(refs[p]=refs[p]||[]).push(qid);}
  let items=[];
  for(const p of Object.keys(refs)){let d;try{d=await loadPage(Number(p));}catch(e){continue;}for(const q of d.questions)if(refs[p].includes(q.id))items.push({page:Number(p),q,wrec:normW(W[p+'|'+q.id])});}
  items.sort((a,b)=>((a.wrec.corrected)?1:0)-((b.wrec.corrected)?1:0));
  window.__pendingLegacy=w.length-items.length;
  if(!items.length){view().innerHTML=header()+barHTML('مراجعة أخطائي',false)+'<div class="card center" style="margin-top:14px">'+(w.length?'عندك '+ar(w.length)+' سؤالًا مخطئًا قيد المراجعة، سيظهر حله عند اعتماده.':'لا توجد أخطاء مسجلة حاليًا.')+'</div>';return;}
  if(window.__pendingLegacy>0)try{alert('عندك '+ar(window.__pendingLegacy)+' سؤالًا مخطئًا قديمًا قيد المراجعة، سيظهر حله عند اعتماده.');}catch(e){}
  newSession({mode:'wrongs',sid:'wrongs',title:'مراجعة أخطائي',items,timed:null});
}
function newSession(s){
  stopTick();
  SESS=Object.assign({answers:{},checked:{},current:0},s);
  if(SESS.timed==='total')SESS.endsAt=Date.now()+SESS.totalSec*1000;
  SESS.startQAt=Date.now();
  persistSess();
  startTick();
  renderQ();
}
function persistSess(){
  // persist lightweight session (without big images) for resume
  const lite={mode:SESS.mode,sid:SESS.sid,title:SESS.title,timed:SESS.timed,perQ:SESS.perQ,totalSec:SESS.totalSec,answers:SESS.answers,checked:SESS.checked,current:SESS.current,refs:SESS.items.map(it=>({page:it.page,id:it.q.id}))};
  store.patch(o=>{o.session=lite;});
}
async function resume(){
  const lite=store.get().session;if(!lite)return;
  view().innerHTML='<div class="spin">جارٍ استئناف الاختبار…</div>';
  const byPage={};for(const r of lite.refs)(byPage[r.page]=byPage[r.page]||[]).push(r.id);
  let items=[];
  for(const p of Object.keys(byPage)){const d=await loadPage(Number(p));for(const q of d.questions)if(byPage[p].includes(q.id))items.push({page:Number(p),q});}
  if(lite.mode==='wrongs'){const W=store.get().wrongs||{};items.forEach(it=>{it.wrec=normW(W[it.page+'|'+it.q.id]||null);});}
  const order=lite.refs.map(r=>r.page+'|'+r.id);
  items.sort((a,b)=>order.indexOf(a.page+'|'+a.q.id)-order.indexOf(b.page+'|'+b.q.id));
  SESS={mode:lite.mode,sid:lite.sid,title:lite.title,timed:lite.timed,perQ:lite.perQ,answers:lite.answers||{},checked:lite.checked||{},current:lite.current||0,items};
  if(SESS.timed==='total')SESS.endsAt=Date.now()+(lite.totalSec||1500)*1000;
  SESS.startQAt=Date.now();
  startTick();renderQ();
}
/* ---------- question rendering ---------- */
function goQ(i){SESS.current=i;SESS.startQAt=Date.now();persistSess();renderQ();window.scrollTo(0,0);}
function renderQ(){
  const it=SESS.items[SESS.current];const q=it.q;const i=SESS.current;
  const n=SESS.items.length;
  const checked=!!SESS.checked[i];
  const a=SESS.answers[i];
  let input='';
  if(q.type==='multiple_choice'){
    input='<div class="opts">'+letters.map((l,k)=>{
      let cls='opt';if(a===k)cls+=' sel';
      if(checked){const ok=grade(q,a);const right=(q.answerSpec.option_index_1based-1)===k;if(right)cls+=' right';else if(a===k)cls+=' wrong';}
      return `<button class="${cls}" data-k="${k}" ${checked?'disabled':''}>${l}</button>`;
    }).join('')+'</div>';
  }else if(q.type==='choice_set'){
    const sel=Array.isArray(a)?a:[];
    input='<div class="opts">'+letters.map((l,k)=>{
      let cls='opt'+(sel.includes(k)?' sel':'');
      return `<button class="${cls}" data-mk="${k}" ${checked?'disabled':''}>${l}</button>`;
    }).join('')+'</div><div class="note" style="color:#6b7c8a">اختر كل الإجابات الصحيحة ثم اضغط تأكيد</div>';
  }else{
    const hint=q.type==='ratio'?'مثال: 3:5 أو 0.6':q.type==='percentage'?'مثال: 25٪ أو 25':'اكتب الناتج';
    input=`<div class="freein"><input id="freev" inputmode="text" placeholder="${hint}" value="${a!=null?esc(a):''}" ${checked?'disabled':''}></div>`;
  }
  let fb='';
  if(checked){
    const ok=grade(q,a);
    fb=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'إجابة صحيحة ✅':'إجابة غير صحيحة ❌'}</b> — الإجابة الصحيحة: <b>${esc(correctText(q))}</b></div>`;
    if(q.reason)fb+=whyBox(q);
    else if(q.answerDisplay!=null&&q.type!=='multiple_choice')fb+=`<div class="why"><b>الناتج:</b> ${esc(q.answerDisplay)}</div>`;
  }
  const trainMode=!SESS.timed;
  view().innerHTML=barHTML(SESS.title,!!SESS.timed)+`
  <div class="prog"><i style="width:${Math.round((i)/n*100)}%"></i></div>
  <div class="qcard">
    <div class="qnum">سؤال ${ar(i+1)} من ${ar(n)} · صفحة ${ar(it.page)} من المذكرة</div>
    <div class="qimg"><img src="${q.readerImage||q.image}" alt="السؤال" onclick="zoomImg(this.src)"><div class="zoomhint">اسحب الصورة أفقيًا عند الحاجة · اضغط عليها للتكبير 🔍</div></div>
    ${it.wrec?`<div class="wrec">إجابتك الخاطئة: <b>${esc(fmtAns(q,it.wrec.a))}</b>${it.wrec.corrected?' · <span class="wok">صحّحتها ✅</span>':''}</div>`:''}
    ${input}
    ${fb}
    <div class="btnrow">
      ${!checked?`<button class="btn gold" id="confirm">تأكيد الإجابة</button>`:''}
      ${checked||!trainMode?(i<n-1?`<button class="btn" id="nextq">السؤال التالي</button>`:`<button class="btn gold" id="finish">إنهاء وعرض النتيجة</button>`):''}
      ${trainMode&&!checked?`<button class="btn ghost" id="skipq">تخطَّ</button>`:''}
    </div>
  </div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SESS.answers[i]=Number(b.dataset.k);renderQ();});
  document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const k=Number(b.dataset.mk);let arr=Array.isArray(SESS.answers[i])?[...SESS.answers[i]]:[];arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];SESS.answers[i]=arr;renderQ();});
  const cf=$('#confirm');if(cf)cf.onclick=confirmAnswer;
  const nx=$('#nextq');if(nx)nx.onclick=()=>goQ(i+1);
  const fn=$('#finish');if(fn)fn.onclick=finish;
  const sk=$('#skipq');if(sk)sk.onclick=()=>goQ(Math.min(i+1,n-1));
  const fi=$('#freev');if(fi){fi.addEventListener('keydown',e=>{if(e.key==='Enter')confirmAnswer();});}
  if(SESS.timed)renderTimer();
}
function confirmAnswer(){
  const i=SESS.current;const q=SESS.items[i].q;
  if(q.type!=='multiple_choice'&&q.type!=='choice_set'){const fi=$('#freev');if(fi)SESS.answers[i]=fi.value;}
  if(SESS.answers[i]===undefined||SESS.answers[i]===''||(Array.isArray(SESS.answers[i])&&!SESS.answers[i].length))return;
  if(!SESS.timed){
    SESS.checked[i]=true;
    const ok=grade(q,SESS.answers[i]);
    recordAnswer(SESS.items[i].page+'|'+q.id,!!ok,SESS.answers[i]);
    if(SESS.mode==='train'||SESS.mode==='wrongs'){
      store.patch(o=>{o.tp=o.tp||{};const k=SESS.sid;o.tp[k]=o.tp[k]||{a:0,c:0};o.tp[k].a++;if(ok)o.tp[k].c++;});
    }
  }else{
    SESS.checked[i]=true;
    recordAnswer(SESS.items[i].page+'|'+q.id,!!grade(q,SESS.answers[i]),SESS.answers[i]);
  }
  persistSess();renderQ();
}
function finish(){
  stopTick();
  const n=SESS.items.length;let score=0;const rows=[];
  SESS.items.forEach((it,i)=>{
    const a=SESS.answers[i];
    const ok=grade(it.q,a)===true;
    if(ok)score++;
    rows.push({i,it,a,ok});
  });
  if(SESS.mode==='test')bestScore(SESS.sid,score,n);
  store.patch(o=>{delete o.session;});
  const pct=n?score/n:0;
  const msg=pct>=.9?'ممتاز! نتيجة رائعة':pct>=.75?'جيد جدًا، قريب من التمام':pct>=.5?'جيد، راجع أخطاءك وستتحسن':'تحتاج تدريبًا أكثر على هذا الدرس';
  let h=barHTML('النتيجة — '+SESS.title,false);
  h+=`<div class="card result"><div class="big">أحرزت ${ar(score)} من ${ar(n)}</div><div class="msg">${msg}</div><div style="color:#6b7c8a;margin-top:6px">النسبة: ${ar(Math.round(pct*100))}٪</div>
  <div class="btnrow"><button class="btn gold" onclick="route('#tests')">الاختبارات</button><button class="btn" onclick="route('#wrongs');startWrongs()">راجع أخطاءك</button><button class="btn ghost" onclick="route('#home')">الرئيسية</button></div></div>`;
  h+='<h2 class="sec">مراجعة الأسئلة</h2>';
  for(const r of rows){
    h+=`<div class="card review-item"><div class="st ${r.ok?'ok':'bad'}">${r.ok?'✅':'❌'} سؤال ${ar(r.i+1)} — صفحة ${ar(r.it.page)}</div>
    <div class="qimg"><img loading="lazy" src="${r.it.q.readerImage||r.it.q.image}" onclick="zoomImg(this.src)"><div class="zoomhint">اضغط على الصورة للتكبير 🔍</div></div>
    <div class="ans">إجابتك: <b>${esc(respLabel(r.it.q,r.a))}</b> · الصحيح: <b>${esc(correctText(r.it.q))}</b></div>
    ${whyBox(r.it.q)}
    </div>`;
  }
  view().innerHTML=h;window.scrollTo(0,0);
}
function respLabel(q,a){
  if(a===undefined||a===null||a==='')return 'بدون إجابة';
  if(q.type==='multiple_choice')return letters[a]??'—';
  if(q.type==='choice_set')return Array.isArray(a)?a.map(i=>letters[i]).join('، '):'—';
  return String(a);
}

async function downloadOffline(){
