<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--navy:#0E2A47;--navy2:#123C63;--gold:#D8A331;--gold2:#F2C14E;--paper:#F7F3E8;--ink:#1B2A38;--ok:#1E7D46;--bad:#B3362B;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--navy);color:var(--ink);min-height:100vh}
button{font-family:inherit}
#app{max-width:760px;margin:0 auto;padding:0 14px 90px}
.hero{text-align:center;padding:26px 10px 18px;color:#fff}
.hero img.logo{width:92px;height:92px;border-radius:50%;border:3px solid var(--gold);background:var(--navy2)}
.hero h1{margin:10px 0 2px;font-size:30px;color:var(--gold2);letter-spacing:.5px}
.hero .sub{color:#cfe0f0;font-size:15px;margin:2px 0}
.hero .by{color:#9fb8cf;font-size:13px;margin-top:6px}
.stats{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.stats .chip{background:var(--navy2);color:#fff;border:1px solid #2a4f77;border-radius:14px;padding:8px 14px;font-size:14px}
.stats .chip b{color:var(--gold2)}
.menu{display:grid;gap:12px;margin-top:18px}
.mbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:none;border-radius:16px;padding:16px;font-size:18px;font-weight:700;color:var(--navy);cursor:pointer;text-align:right;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mbtn .ic{font-size:26px}
.mbtn small{display:block;font-weight:400;color:#5a6b7a;font-size:13px;margin-top:3px}
.mbtn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3d2c05}
h2.sec{color:#fff;font-size:20px;margin:22px 0 10px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.lesson-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.lesson-head .t{font-weight:700;color:var(--navy);font-size:16px}
.lesson-head .n{color:#6b7c8a;font-size:13px}
.lesson-body{margin-top:10px;display:none}
.lesson.open .lesson-body{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{flex:1;min-width:200px;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;color:var(--navy);cursor:pointer}
.pill .c{font-weight:400;color:#6b7c8a;font-size:12.5px}
.pill .best{color:var(--ok);font-size:12.5px;font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);padding:10px 0;display:flex;align-items:center;gap:10px}

.foot{color:#7e96ac;text-align:center;font-size:13px;margin-top:26px;line-height:2}

.install b{color:var(--gold2)}
.center{text-align:center}
.spin{color:#fff;text-align:center;padding:40px;font-size:16px}

<div id="app"><div class="spin">جارٍ التحميل…</div></div>
<script src="../math.js"></script>

<script>
'use strict';
const $=s=>document.querySelector(s);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const letters=['أ','ب','ج','د'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Zoom overlay */
let zoomScale=1;
function fitImg(im){
  try{
    const box=im.parentElement;if(!box||im.dataset.fit)return;im.dataset.fit='1';
    const W=im.naturalWidth,H=im.naturalHeight;if(!W||!H)return;
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0);
    const d=x.getImageData(0,0,W,H).data,M=6;
    const teal=(i,j)=>{const k=(j*W+i)*4,r=d[k],g=d[k+1],b=d[k+2];return r<90&&g>r+35&&b>r+35&&g<175;};
    const ink=(i,j)=>{const k=(j*W+i)*4;return (d[k]*0.3+d[k+1]*0.59+d[k+2]*0.11<150)||teal(i,j);};
    im.style.display='none';const avail=Math.max(200,Math.min(box.getBoundingClientRect().width,window.innerWidth-52)-12),dpr=window.devicePixelRatio||1;
    // teal label components (grid flood fill)
    const G=6,gw=Math.ceil(W/G),gh=Math.ceil(H/G),cell=new Int32Array(gw*gh);
    for(let j=M;j<H-M;j++)for(let i=M;i<W-M;i++)if(teal(i,j))cell[((j/G)|0)*gw+((i/G)|0)]++;
    const seen=new Uint8Array(gw*gh),labels=[];
    for(let s0=0;s0<cell.length;s0++){if(!cell[s0]||seen[s0])continue;
      const st=[s0];seen[s0]=1;let n=0,x0=1e9,x1=-1,y0=1e9,y1=-1;
      while(st.length){const u=st.pop(),cx=u%gw,cy=(u/gw)|0;n+=cell[u];x0=Math.min(x0,cx);x1=Math.max(x1,cx);y0=Math.min(y0,cy);y1=Math.max(y1,cy);
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const v=ny*gw+nx;if(cell[v]&&!seen[v]){seen[v]=1;st.push(v);}}}
      if(n>=25){let a=1e9,b=-1,c2=1e9,e=-1;for(let j=y0*G;j<Math.min(H-M,y1*G+G);j++)for(let i=x0*G;i<Math.min(W-M,x1*G+G);i++)if(teal(i,j)){if(i<a)a=i;if(i>b)b=i;if(j<c2)c2=j;if(j>e)e=j;}labels.push({x0:a,x1:b,y0:c2,y1:e});}}
    if(labels.length<2)return fallback();
    function fallback(){ // no choice labels found: whole image fitted to width, nothing cropped
      im.style.cssText='width:100%;max-width:100%;height:auto;display:block;margin:0 auto';}
    // rows of labels
    labels.sort((p,q)=>(p.y0+p.y1)-(q.y0+q.y1));
    const rows=[];for(const L of labels){const cy=(L.y0+L.y1)/2;const r=rows.find(r=>Math.abs(r.cy-cy)<(L.y1-L.y0)*0.9+8);if(r){r.items.push(L);r.cy=(r.cy*(r.items.length-1)+cy)/r.items.length;}else rows.push({cy,items:[L]});}
    const strong0=(i,j)=>{const k=(j*W+i)*4;return d[k]*0.3+d[k+1]*0.59+d[k+2]*0.11<105||teal(i,j);};
    const dk=(i,j)=>{const k=(j*W+i)*4;return d[k]*0.3+d[k+1]*0.59+d[k+2]*0.11<140||teal(i,j);};
    const rowHas=(xa,xb,ya,yb)=>{for(let j=Math.max(M,ya);j<=Math.min(H-M-1,yb);j++){let n=0;for(let i=xa;i<=xb;i++)if(dk(i,j)&&++n>=1)return true;}return false;};
    const pieces=[];
    rows.sort((p,q)=>p.cy-q.cy);
    const bnd=[];for(let ri=0;ri<rows.length-1;ri++){const c1=rows[ri].cy,c2=rows[ri+1].cy,mid=(c1+c2)/2;let best=mid,bd=1e9;
      for(let j=Math.ceil(c1+(c2-c1)*0.25);j<=Math.floor(c2-(c2-c1)*0.25);j++){let blank=true;for(let i=M;i<W-M;i++)if(dk(i,j)){blank=false;break;}if(blank&&Math.abs(j-mid)<bd){bd=Math.abs(j-mid);best=j;}}
      bnd.push(best);}
    rows.forEach((r,ri)=>{r.lo=ri?bnd[ri-1]:-1e9;r.hi=ri<rows.length-1?bnd[ri]:1e9;});
    for(const r of rows){r.items.sort((p,q)=>q.x1-p.x1);
      r.items.forEach((L,k)=>{const nx=r.items[k+1];const xa=nx?nx.x1+3:M,xb=Math.min(W-M-1,L.x1+14);
        let ya=L.y0,yb=L.y1;const lh=L.y1-L.y0+1,ymin=Math.max(r.lo,L.y0-Math.round(lh*1.8)),ymax=Math.min(r.hi,L.y1+Math.round(lh*1.8));
        for(;;){let t=-1;for(let j=ya-1;j>=Math.max(M,ymin,ya-12);j--)if(rowHas(xa,xb,j,j)){t=j;break;}if(t<0)break;ya=t;}
        for(;;){let t=-1;for(let j=yb+1;j<=Math.min(H-M-1,ymax,yb+6);j++)if(rowHas(xa,xb,j,j)){t=j;}if(t<0)break;yb=t;}
        // tight x bbox
        let a=1e9,b=-1;for(let j=ya;j<=yb;j++)for(let i=xa;i<=xb;i++)if(ink(i,j)){if(i<a)a=i;if(i>b)b=i;}
        if(b>=a)pieces.push({x0:Math.max(1,a-4),x1:Math.min(W-2,b+4),y0:ya,y1:yb,row:rows.indexOf(r),k});});}
    const cTop=Math.min(...pieces.map(p=>p.y0)),cBot=Math.max(...pieces.map(p=>p.y1));
    // other regions: above choices (stem) and below (figure)
    function bandsIn(ya,yb){const out=[];let st=-1,gap=0;
      for(let j=Math.max(M,ya);j<=Math.min(H-M-1,yb);j++){let has=false;for(let i=M;i<W-M;i++)if(strong0(i,j)){has=true;break;}
        if(has){if(st<0)st=j;gap=0;}else if(st>=0){gap++;if(gap>=6){out.push([st,j-gap]);st=-1;gap=0;}}}
      if(st>=0)out.push([st,Math.min(H-M-1,yb)]);
      return out.map(([y0,y1])=>{let a=1e9,b=-1;for(let j=y0;j<=y1;j++)for(let i=M;i<W-M;i++)if(strong0(i,j)){if(i<a)a=i;if(i>b)b=i;}return {x0:a,x1:b,y0,y1};}).filter(r=>r.x1-r.x0>=4||r.y1-r.y0>=4);}
    const plan=[];const flow=document.createElement('div');flow.className='flow';flow.onclick=()=>zoomImg(im.src);
    function chunk(parent,xa,xb,ya,yb,sc){const w=xb-xa+1,h=yb-ya+1;plan.push([xa,xb,ya,yb]);const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(w*sc*dpr));cv.height=Math.max(1,Math.round(h*sc*dpr));
      cv.style.width=(w*sc)+'px';cv.style.height=(h*sc)+'px';
      const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.imageSmoothingQuality='high';
      g.drawImage(im,xa,ya,w,h,0,0,cv.width,cv.height);parent.appendChild(cv);}
    function section(bs,textScale){for(const r of bs){const row=document.createElement('div');row.className='frow';
      const w=r.x1-r.x0+1,h=r.y1-r.y0+1;
      if(w/h>5&&w*textScale>avail){ // text line: break at word gaps, wrap right to left
        row.classList.add('wrap');
        const cols=[];for(let i=r.x0;i<=r.x1;i++){let hv=false;for(let j=r.y0;j<=r.y1;j++)if(ink(i,j)){hv=true;break;}cols.push(hv);}
        const words=[];let a=-1,g=0;for(let k=0;k<cols.length;k++){if(cols[k]){if(a<0)a=k;g=0;}else if(a>=0){g++;if(g>=5){words.push([r.x0+a,r.x0+k-g]);a=-1;g=0;}}}
        if(a>=0)words.push([r.x0+a,r.x1]);words.reverse();
        const wh=words.map(([xa,xb])=>{let a=1e9,b=-1;for(let j=r.y0;j<=r.y1;j++)for(let i=xa;i<=xb;i++)if(ink(i,j)){if(j<a)a=j;if(j>b)b=j;break;}return b-a+1;});
        const med=[...wh].sort((p,q)=>p-q)[wh.length>>1];
        let cur=null;
        words.forEach(([xa,xb],k)=>{const tall=wh[k]>1.45*med&&k>0;
          if(!tall||!cur){cur=document.createElement('div');cur.style.cssText='display:flex;flex-wrap:nowrap;align-items:flex-end;gap:8px';row.appendChild(cur);}
          chunk(cur,xa,xb,r.y0,r.y1,Math.min(textScale,avail/(xb-xa+1)));});
      }else chunk(row,r.x0,r.x1,r.y0,r.y1,Math.min(w/h>5?textScale:1,avail/w));
      flow.appendChild(row);}}
    const stemBands=bandsIn(M,cTop-1);
    if(stemBands.some(b=>(b.x1-b.x0+1)/(b.y1-b.y0+1)<=5&&(b.y1-b.y0+1)>70)){(window.__fit=window.__fit||[]).push({q:window.__curQ||'',ok:false,why:'figure above choices'});im.style.display='';return fallback();}
    section(stemBands,0.85);
    const ch=document.createElement('div');ch.className='fch';
    pieces.sort((p,q)=>p.row-q.row||p.k-q.k);
    for(const p of pieces){const row=document.createElement('div');row.className='frow fchoice';chunk(row,p.x0,p.x1,p.y0,p.y1,Math.min(1.3,avail/(p.x1-p.x0+1)));ch.appendChild(row);}
    flow.appendChild(ch);
    {const fb=bandsIn(cBot+1,H-M-1);if(fb.length){const r={x0:Math.min(...fb.map(b=>b.x0)),x1:Math.max(...fb.map(b=>b.x1)),y0:fb[0].y0,y1:fb[fb.length-1].y1};
      // include lighter anti-aliased edges of the figure (e.g. tops of bold numerals): grow the box while darker-than-paper ink touches it
      const lim=(i,j)=>{const k=(j*W+i)*4;return d[k]*0.3+d[k+1]*0.59+d[k+2]*0.11<170&&!teal(i,j);};
      for(let g=0;g<3;g++){let ch=false;
        for(let t=0;t<14&&r.y0-1>cBot;t++){let h=false;for(let i=r.x0;i<=r.x1;i++)if(lim(i,r.y0-1)){h=true;break;}if(!h)break;r.y0--;ch=true;}
        for(let t=0;t<14&&r.y1+1<H-M-1;t++){let h=false;for(let i=r.x0;i<=r.x1;i++)if(lim(i,r.y1+1)){h=true;break;}if(!h)break;r.y1++;ch=true;}
        if(!ch)break;}
      r.y0=Math.max(cBot+1,r.y0-2);r.y1=Math.min(H-M-1,r.y1+2);r.x0=Math.max(M,r.x0-3);r.x1=Math.min(W-M-1,r.x1+3);
      const row=document.createElement('div');row.className='frow';chunk(row,r.x0,r.x1,r.y0,r.y1,Math.min(1,avail/(r.x1-r.x0+1)));flow.appendChild(row);}}
    // self-check: every ink pixel drawn exactly once, choice pieces sane, else fall back to the plain whole image
    {let tot=0,miss=0,dup=0;const mb=[1e9,-1,1e9,-1];const cnt=new Uint8Array(W*H);
      for(const [xa,xb,ya,yb] of plan)for(let j=ya;j<=yb;j++)for(let i=xa;i<=xb;i++){const k=j*W+i;if(cnt[k]<255)cnt[k]++;}
      const strong=(i,j)=>{const k=(j*W+i)*4;return d[k]*0.3+d[k+1]*0.59+d[k+2]*0.11<105||teal(i,j);};
      for(let j=M;j<H-M;j++)for(let i=M;i<W-M;i++)if(strong(i,j)){tot++;const v=cnt[j*W+i];if(v===0){miss++;mb[0]=Math.min(mb[0],i);mb[1]=Math.max(mb[1],i);mb[2]=Math.min(mb[2],j);mb[3]=Math.max(mb[3],j);}else if(v>1)dup++;}
      const lhs=labels.map(l=>l.y1-l.y0+1),lmax=Math.max(...lhs);
      const bigPiece=pieces.some(p=>(p.y1-p.y0+1)>3.4*lmax);
      const foreign=pieces.some(pc=>labels.some(l=>{const own=Math.abs((l.y0+l.y1)/2-(rows[pc.row].cy))<1e-6;return !(l.x1<pc.x0||l.x0>pc.x1||l.y1<pc.y0||l.y0>pc.y1)&&!rows[pc.row].items.includes(l);}));
      const ok=!foreign&&tot>0&&miss/tot<0.004&&dup/tot<0.004&&!bigPiece&&pieces.length===labels.length&&pieces.length>=2&&pieces.length<=6;
      (window.__fit=window.__fit||[]).push({q:window.__curQ||'',ok,foreign,mb,tot,miss,dup,bigPiece,labels:labels.length,pieces:pieces.length});
      if(!ok){im.style.display='';return fallback();}}
    im.style.display='none';box.insertBefore(flow,im);
    const hn=box.querySelector('.zoomhint');if(hn)hn.textContent=hn.textContent.replace('اسحب الصورة أفقيًا عند الحاجة · ','');
  }catch(e){im.style.cssText='width:100%;max-width:100%;height:auto;display:block';}
}
function zoomImg(src){const o=$('#zoomer'),im=$('#zoomimg');im.src=src;zoomScale=1;im.style.width='100%';o.classList.add('open');document.body.style.overflow='hidden';}
function zoomMult(f){const im=$('#zoomimg');zoomScale=Math.min(4,Math.max(.5,zoomScale*f));im.style.width=((im.naturalWidth||800)*zoomScale)+'px';}

":["المثلث أ ج د قائم في د: أ د{^٢} = ٥{^٢} − ٤{^٢} = ٩","أ د = ٣","في المثلث أ ب د القائم في د زاوية ب = ٣٠{deg}","ظل ٣٠{deg} = أ د ÷ ب د","ب د = ٣ ÷ ظل ٣٠{deg} = ٣ × {sqrt:٣}","الإجابة: ب (٣{sqrt:٣} سم)"]},"p239-q02":{"s":["زاويتا المثلث القائم الحادتان: ٦٠{deg} و ٣٠{deg}","الضلع المقابل للزاوية الأكبر أطول","الضلع المقابل لـ ٦٠{deg} أطول من المقابل لـ ٣٠{deg}","الإجابة: ب (القيمة الثانية أكبر)"]},"p239-q03":{"s":["المثلث الأول قائم في ب وزاوية ٣٠{deg} عند الرأس العلوي، فأ ب هو الضلع المقابل لـ ٣٠{deg}","المثلث الثاني قائم في ج وزاوية ٦٠{deg} عند الرأس السفلي الأيمن (غير مسمى)، فزاوية د = ٣٠{deg} ود ج هو الضلع المقابل لـ ٦٠{deg}","لا يُعطى أي طول في المثلثين ولا تطابقهما","مثال: الأول بضلع قصير ١ والثاني بضلع قصير ١٠ ← د ج أكبر من أ ب","مثال: الأول بضلع قصير ١٠ والثاني ١ ← أ ب أكبر من د ج","الإجابة: د (المعطيات غير كافية)"]},"p269-q01":{"s":["محيط المستطيل = مجموع أضلاعه الأربعة","المحيط = س + ص + س + ص","المحيط = ٢س + ٢ص","الإجابة: ب"]},"p269-q02":{"s":["مساحة المستطيل = ٣٫٥ × ٢٫٢ = ٧٫٧ سم{^٢}","القيمة الثانية = ٧ سم{^٢}","٧٫٧ > ٧ ← القيمة الأولى أكبر","الإجابة: أ"]},"p269-q03":{"s":["مساحة الحائط = ١٫٥ × ٢٫٢ = ٣٫٣ م{^٢}","التكلفة = ٣٫٣ × ١٠ = ٣٣ ريال","الإجابة: ج (٣٣)"]},"p270-q01":{"s":["محيط المستطيل = ٢ × (٢٠ + ١٠) = ٦٠ م","المشي مرتين = ٢ × ٦٠ = ١٢٠ م","الإجابة: ب (١٢٠)"]},"p270-q02":{"s":["القطران يقسمان المستطيل إلى ٤ مثلثات صغيرة","كل قطر يقسم المستطيل إلى مثلثين كبيرين فيوجد ٤ مثلثات كبيرة (كل مثلث كبير يضم مثلثين صغيرين)","العدد = ٤ + ٤ = ٨","الإجابة: ج (٨)"]},"p270-q04":{"s":["ل و س زاويتان على المستقيم العلوي مع زاوية رأس المثلث أ: ل + أ + س = ١٨٠ ← ل + س = ١٨٠ − أ","ص زاوية خارجية عند الرأس السفلي الأيسر للمثلث: ص = ١٨٠ − ب","ع زاوية خارجية عند الرأس السفلي الأيمن: ع = ١٨٠ − ج","المجموع = (١٨٠ − أ) + (١٨٠ − ب) + (١٨٠ − ج) = ٥٤٠ − (أ + ب + ج)","أ + ب + ج = ١٨٠ ← المجموع = ٥٤٠ − ١٨٠ = ٣٦٠{deg}","الإجابة: د (٣٦٠)"]},"p271-q01":{"s":["أ ب = د ج = ٤ (ضلعان متقابلان في المستطيل)","د ج = هـ ج (علامتا التساوي) ← هـ ج = ٤","ب ج = ٤ × هـ ج = ١٦","المساحة = ٤ × (٢ × س) × س = س × س","س × س = ١٠٠","مساحة المربع = ١٠٠ سم{^٢}","الإجابة: ب (١٠٠)"]},"p297-q01":{"s":["المربعان متساويان ضلع كل منهما ٥ سم ويتلامسان في نقطة","لا تضيع أضلاع بالتلاصق لأنه في نقطة واحدة","المحيط = ٢ × (٤ × ٥) = ٤٠ سم","الإجابة: د (٤٠)"]},"p297-q02":{"s":["مستقيمان رأسيان متوازيان يقطعهما القاطع المائل","زاويتا س و ٦٠{deg} داخليتان في جهة واحدة من القاطع (متحالفتان) فمجموعهما ١٨٠{deg}","س = ١٨٠ − ٦٠ = ١٢٠{deg}","الإجابة: د (١٢٠)"]},"p298-q02":{"s":["محيط المربع ١٦ ← الضلع = ١٦ ÷ ٤ = ٤","مساحة المربع = ٤ × ٤ = ١٦","المستطيلان متطابقان فمساحة الواحد = ١٦ ÷ ٢ = ٨","الإجابة: أ (٨)"]},"p299-q01":{"s":["مساحة المعين = {frac:١|٢} × حاصل ضرب القطرين","{frac:١|٢} × ٦ × ٨ = ٢٤ سم{^٢}","الإجابة: ب (٢٤)"]},"p299-q02":{"s":["قطرا المعين متعامدان وينصف كل منهما الآخر","نصف القطر المعلوم = ١٢ ÷ ٢ = ٦","المثلث القائم: وتر ١٠ وضلع ٦","مربع نصف القطر الآخر = (١٠ × ١٠) − (٦ × ٦) = ٦٤ ← نصف القطر الآخر = ٨","القطر الآخر = ٨ × ٢ = ١٦","الإجابة: ج (١٦)"]},"p300-q01":{"s":["زاويتان متجاورتان في المعين مجموعهما ١٨٠{deg}","٢س + ٣س = ١٨٠","٥س = ١٨٠ ← س = ٣٦","زاوية د تقابل زاوية ب فتساويها = ٣س","٣ × ٣٦ = ١٠٨{deg}","الإجابة: ج (١٠٨)"]},"p301-q01":{"s":["نصفا القطرين ٣ و ٤","مربع ضلع المعين = (٣ × ٣) + (٤ × ٤) = ٢٥ ← الضلع = ٥","محيط المعين = ٤ × ٥ = ٢٠ سم","المربع مساحته ٢٥ ← ضلعه ٥ ← محيطه ٢٠ سم","القيمتان متساويتان","الإجابة: ج"]},"p301-q02":{"s":["ب ج ∥ أ ص و ب ج = ب س (العلامتان) ← مثلث ب ج س متساوي الساقين","زاوية ص = زاوية ب ج س = زاوية س ← أ ص = أ س = ١٥","أ ب + ب س = ١٥ و ب ج = ب س","أ ب + ب ج = ١٥","المحيط = ٢ × (أ ب + ب ج) = ٢ × ١٥ = ٣٠ سم","الإجابة: ب (٣٠)"]},"p301-q03":{"s":["مساحة المستطيل = ٥ × ٤ = ٢٠","في متوازي الأضلاع القاعدة ٤ والضلع المائل ٥","الارتفاع هو الضلع القائم في المثلث الذي وتره ٥ فهو أصغر من ٥ (الارتفاع < ٥)","مساحة المتوازي = ٤ × الارتفاع < ٤ × ٥ = ٢٠","القيمة الأولى أكبر","الإجابة: أ"]},"p302-q01":{"s":["زاوية المتوازي المقابلة للزاوية ١١٠{deg} مجاورة لها: ١٨٠ − ١١٠ = ٧٠{deg}","الخط الداخلي يوازي الضلع الأيسر ← الزاوية عند القاعدة = ٧٠{deg}","المثلث الأيمن متساوي الساقين (العلامتان)","زاويتا القاعدة ٧٠{deg} و ٧٠{deg}","س = ١٨٠ − (٧٠ + ٧٠) = ٤٠{deg}","الإجابة: ج (٤٠)"]},"p302-q02":{"s":["أ ب = ٢ و ه منتصفه (العلامتان) ← ب ه = ١","و ه ∥ ج ب والمسافة بينهما ١ ← ج و ه ب شبه منحرف","و على القطر أ ج ← و ه = ١ (مثلث متشابه) وقاعدته ج ب = ٢","المساحة = {frac:١|٢} × (٢ + ١) × ١ = ١٫٥ سم{^٢}","الإجابة: أ (١٫٥)"]},"p303-q01":{"s":["الارتفاعات الأربعة للمنحرفات متساوية والمربع الداخلي (٥) مشترك","كل منحرف قاعدتاه ضلع المربع الكبير وضلع المربع الداخلي ← مساحاته الأربعة متساوية","القيمة الأولى = ١ + ٢ + ٥ والثانية = ٣ + ٤ + ٥","١ = ٢ = ٣ = ٤ ← القيمتان متساويتان","الإجابة: ج"]},"p304-q01":{"s":["نضع أ عند ٠ ← د عند ٢٤ (أ د = ٢٤)","ب عند ١٨ (أ ب = ١٨) ← ج عند ٢٤ − ١٤ = ١٠ (د ج = ١٤)","الترتيب أ ، ج ، ب ، د صحيح","ب ج = ١٨ − ١٠ = ٨","الإجابة: ب (٨)"]},"p305-q01":{"s":["الأضلاع تتصل بمنتصفات الأضلاع فكل مربع داخلي مساحته نصف مساحة الذي يحويه","المربع الصغير: ٢ × ٢ = ٤","المربع المتوسط = ٢ × ٤ = ٨","المربع الكبير = ٢ × ٨ = ١٦ سم{^٢}","الإجابة: ب (١٦)"]},"p305-q02":{"s":["المثلث الكبير مساحته ٦٤ ويقسم بمنتصفات أضلاعه إلى ٤ مثلثات متطابقة","مساحة كل منها = ٦٤ ÷ ٤ = ١٦","كل مثلث من الأركان الثلاثة يقسم مرة أخرى إلى ٤ ← مساحة الصغير = ١٦ ÷ ٤ = ٤","المظلل ٣ مثلثات صغيرة = ٣ × ٤ = ١٢","الإجابة: د (١٢)"]},"p307-q01":{"s":["ارتفاع شبه المنحرف = ٢ + ٦ = ٨","مساحته = {frac:١|٢} × (٣ + ٩) × ٨ = ٤٨","المثلث العلوي الأبيض = {frac:١|٢} × ٣ × ٢ = ٣","المثلث السفلي الأبيض = {frac:١|٢} × ٩ × ٦ = ٢٧","المظلل = ٤٨ − (٣ + ٢٧) = ١٨","الإجابة: أ (١٨)"]},"p307-q02":{"s":["المربع طول ضلعه ٤ مقسوم إلى ٤ مربعات طول ضلع كل منها ٢","المظلل شبه منحرف: قاعدتاه ٤ و ٢ وارتفاعه ٢","المساحة = {frac:١|٢} × (٤ + ٢) × ٢ = ٦ سم{^٢}","٦ < ٧ ← القيمة الثانية أكبر","الإجابة: ب"]},"p308-q01":{"s":["الشكل مقسوم إلى ٦ مربعات صغيرة كل منها ٢ × ٢ = ٤ فمساحة كل مثلث ٢","المظلل شبه منحرف: قاعدتاه ٦ و ٢ وارتفاعه ٢","المساحة = {frac:١|٢} × (٦ + ٢) × ٢ = ٨","٨ < ٩ ← القيمة الثانية أكبر","الإجابة: ب"]},"p309-q01":{"s":["الشكل مقسوم إلى ٤ مستطيلات متطابقة بالقطرين","قطر المستطيل يقسمه إلى مثلثين متساويين المساحة ← المظلل نصف كل مستطيل","نسبة المظلل = {frac:١|٢} = ٥٠٪","الإجابة: أ (٥٠٪)"]},"p310-q02":{"s":["كل مثلث مظلل هو نصف ربع المربع = {frac:١|٨} من مساحة المربع","مثلثان ← المظلل = {frac:٢|٨} = {frac:١|٤} المربع","{frac:١|٤} × المساحة = ٣ ← المساحة = ٣ × ٤","المساحة = ١٢ سم{^٢}","الإجابة: أ (١٢)"]},"p347-q02":{"s":["الضلع العلوي والقاعدة متوازيان","زوايا المثلث: ٦٠ + ٢س + س = ١٨٠","٣س = ١٢٠","س = ٤٠","ص تبادل س (الزاويتان المتبادلتان بين المتوازيين)","ص = ٤٠{deg}","الإجابة: ب (٤٠)"]},"p348-q02":{"s":["العلامتان على الضلعين تعنيان تساويهما ← المثلث متساوي الساقين","زاوية القاعدة اليسرى = ٥٠ (تبادل مع الزاوية ٥٠ بين المتوازيين)","زاويتا القاعدة متساويتان ← س = ٥٠","ص تبادل س","ص = ٥٠{deg}","الإجابة: ب (٥٠)"]},"p349-q01":{"s":["العلامتان على الضلعين تعنيان تساويهما ← المثلث متساوي الساقين","زاوية الرأس ٥٠","زاويتا القاعدة = (١٨٠ − ٥٠) ÷ ٢ = ٦٥","الضلع الأيسر يوازي المستقيم الخارج من الرأس الأيمن","س تناظر زاوية القاعدة اليسرى","س = ٦٥{deg}","الإجابة: ج (٦٥)"]},"p349-q02":{"s":["الزاوية ٥٥ عند المستقيم العلوي بين المستقيم والقاطع","س عند المستقيم السفلي في الجهة الأخرى من القاطع","المستقيمان متوازيان ← س + ٥٥ = ١٨٠ (زاويتان متحالفتان)","س = ١٢٥{deg}","الإجابة: ج (١٢٥)"]},"p350-q02":{"s":["ج د ∥ ب أ ← زاويتا ج و ب متحالفتان","زاوية ب = ١٨٠ − ١١٢ = ٦٨","في المثلث ه ب أ: زاوية أ = ٢٥","زاوية ب ه أ = ١٨٠ − ٦٨ − ٢٥ = ٨٧","س = ١٨٠ − ٨٧","س = ٩٣{deg}","الإجابة: أ (٩٣)"]},"p351-q02":{"s":["الأضلاع الأفقية كلها متعامدة مع القطع الرأسية ← الأفقيان العلوي والسفلي متوازيان","زاوية ٢٦ عند المستقيم العلوي وزاوية س عند المستقيم السفلي في الجهتين المتقابلتين من القاطع","الزاويتان متبادلتان خارجيا بين متوازيين","س = ٢٦{deg}","الإجابة: أ (٢٦)"]},"p352-q02":{"s":["القطعتان الرأسيتان كلتاهما عمودية على القاعدة ← متوازيتان","س هي زاوية رأس المثلث الكبير بين الوتر والضلع الرأسي","ص هي زاوية رأس المثلث الصغير بين الوتر والقطعة الرأسية","الزاويتان متناظرتان بين متوازيين","س = ص","الإجابة: ج (القيمتان متساويتان)"]},"p353-q02":{"s":["المستقيمان المرسومان بالسهمين متوازيان","ص تناظر زاوية الرأس العلوي للمثلث الكبير وس زاوية القاعدة اليمنى","المثلث الكبير قائم ← س + ص = ٩٠","٣س + ٢ص = ٢(س + ص) + س","٣س + ٢ص = ١٨٠ + س","س أكبر من الصفر ← ٣س + ٢ص أكبر من ١٨٠","الإجابة: أ (القيمة الأولى أكبر)"]},"p354-q01":{"s":["نرسم من رأس الانكسار موازيا للمستقيمين","الجزء الأول: ١٨٠ − ١٢٠ = ٦٠ (زاويتان متحالفتان)","الجزء الثاني = ٧٠ (تبادل مع الزاوية ٧٠)","س = ٦٠ + ٧٠","س = ١٣٠{deg}","الإجابة: ج (١٣٠)"]},"p355-q01":{"s":["المستقيمان ص و س متوازيان (سهمان)","زاوية ١٢٠ مع الأفقي ← الزاوية الحادة مع الأفقي = ١٨٠ − ١٢٠ = ٦٠","المستقيم س يصنع ٦٠ مع الأفقي (تناظر)","الرأسي عمودي على الأفقي","زاوية ب ج س = ٩٠ − ٦٠","زاوية ب ج س = ٣٠{deg}","الإجابة: أ (٣٠)"]},"p355-q02":{"s":["نرسم من رأس الانكسار موازيا للمستقيمين","الجزء الأول = ١٨٠ − ١٢٠ = ٦٠","الجزء الثاني = ١٨٠ − ١١٠ = ٧٠","زاوية الانكسار = ٦٠ + ٧٠ = ١٣٠","١٣س = ١٣٠","س = ١٠","الإجابة: أ (١٠)"]},"p356-q01":{"s":["الضلعان الرأسيان متوازيان","الزاوية ٤٠{deg} بين الضلع الرأسي الأيسر والقطعة المائلة منه","الزاوية ٣٠{deg} بين الضلع الرأسي الأيمن والقطعة المائلة منه","نرسم من رأس الفجوة مستقيما رأسيا موازيا للضلعين","القطعة اليسرى تصنع مع المستقيم الرأسي ٤٠{deg} (تبادل)","القطعة اليمنى تصنع مع المستقيم الرأسي ٣٠{deg} (تبادل)","س = ٤٠ + ٣٠","س = ٧٠{deg}","الإجابة: أ"]},"p356-q02":{"s":["علامات التساوي على الأضلاع الثلاثة ← المثلث متساوي الأضلاع","كل زاوية فيه ٦٠","المستقيمان متوازيان","س تبادل زاوية المثلث عند الرأس العلوي الأيسر","س = ٦٠{deg}","الإجابة: أ (٦٠)"]},"p357-q02":{"s":["س و ٤٠ متحالفتان على جهتي القاطع عند المستقيم العلوي","س = ١٨٠ − ٤٠ = ١٤٠","ص رأسية مع الزاوية المناظرة للزاوية ٤٠ عند المستقيم السفلي","ص = ٤٠","س + ص = ١٤٠ + ٤٠","س + ص = ١٨٠{deg}","الإجابة: ج (١٨٠)"]},"p358-q01":{"s":["القطعتان ج ب و أ د متوازيتان (سهمان)","الزاوية ٨٠ عند ب بين المستقيم الأفقي والقطعة ب ج","الزاوية س عند د بين المستقيم الأفقي والقطعة د أ","الزاويتان متناظرتان","س = ٨٠{deg}","الإجابة: ب (٨٠)"]},"p360-q01":{"s":["حالة ١: ٧٨ هي زاوية القاعدة اليسرى للمثلث الكبير","حالة ٢: ٧٨ هي مكملتها، فزاوية القاعدة = ١٠٢","عند القاطع الأيمن: الزاوية ١٢٤ منفرجة فهي ١٨٠ − ب، أي ب = ٥٦","حالة ١: س = ١٨٠ − ٧٨ − ٥٦ = ٤٦{deg}","حالة ٢: س = ١٨٠ − ١٠٢ − ٥٦ = ٢٢{deg}","في الحالتين س أقل من ٥٦","الإجابة: ب (القيمة الثانية أكبر)"]},"p361-q01":{"s":["زاويتا المثلث: ٤٠ و ٦٥","الزاوية الثالثة = ١٨٠ − ٤٠ − ٦٥ = ٧٥","الضلع الأيسر يوازي القطعة المائلة (سهمان) والقاعدة توازي المستقيم العلوي","س زاوية بين المستقيم العلوي والقطعة المائلة، وهي مكملة للزاوية ٧٥","س = ١٨٠ − ٧٥","س = ١٠٥{deg}","الإجابة: ب (١٠٥)"]},"p361-q02":{"s":["القطعتان الأفقيتان عموديتان على المستقيم الرأسي ← متوازيتان","س فوق المستقيم العلوي يمين القاطع","ص تحت المستقيم السفلي يسار القاطع","الزاويتان متبادلتان خارجيا","س = ص","الإجابة: ج (القيمتان متساويتان)"]},"p362-q02":{"s":["المستقيمان متوازيان (سهمان)","س وص في الموضع نفسه من القاطع عند كل مستقيم (متناظرتان)","س = ص","٢س = ٢ص أقل من ٣ص لأن ص أكبر من الصفر","الإجابة: ب (القيمة الثانية أكبر)"]},"p363-q01":{"s":["أبعاد متوازي المستطيلات من الرسم: ٣ و ٣ و ٥","الحجم = الطول × العرض × الارتفاع","الحجم = ٣ × ٣ × ٥","الحجم = ٤٥","الإجابة: ج (٤٥)"]},"p363-q02":{"s":["الحجم = الطول × العرض × الارتفاع","الحجم = ٢ × ٣ × ٤","الحجم = ٢٤ م{^٣}","حجم الرمل = حجم الحفرة = ٢٤ م{^٣}","الإجابة: أ (٢٤)"]},"p363-q03":{"s":["المساحة الكلية للغرفة = مساحة أوجهها الستة (الأرض والسقف والجدران)","المساحة الكلية = ٢ × (ط × ع + ط × ا + ع × ا)","= ٢ × (٢٠ × ١٠ + ٢٠ × ٢ + ١٠ × ٢)","= ٢ × (٢٠٠ + ٤٠ + ٢٠)","= ٢ × ٢٦٠","= ٥٢٠ م{^٢}","الإجابة: ب (٥٢٠)"]},"p363-q04":{"s":["الحجم = مساحة القاعدة × ارتفاع الزيت","مساحة قاعدة الإناء = ٦٠ × ٥٠ = ٣٠٠٠ سم{^٢}","٣٠٠٠٠ = ٣٠٠٠ × الارتفاع","الارتفاع = ٣٠٠٠٠ ÷ ٣٠٠٠","الارتفاع = ١٠ سم","الإجابة: أ (١٠)"]},"p364-q01":{"s":["الحجم = ٦ × س × ٣","٧٢ = ١٨ س","س = ٧٢ ÷ ١٨","س = ٤","الإجابة: أ (٤)"]},"p364-q02":{"s":["الحجم = ١ × ٢ × ٣ = ٦ م{^٣}","٦ م{^٣} = ٦٠٠٠ لتر","الزمن = ٦٠٠٠ ÷ ٥٠٠","الزمن = ١٢ دقيقة","الإجابة: أ (١٢)"]},"p364-q03":{"s":["حجم المكعب = ل{^٣}","مساحة سطحه = ٦ ل{^٢}","ل{^٣} = ٦ ل{^٢}","ل = ٦","الإجابة: أ (٦)"]},"p364-q05":{"s":["حجم المكعب الأول = ٢ × ٢ × ٢ = ٨","حج الارتفاع = ٨{^٢} − ٤{^٢} تحت الجذر = ٤{sqrt:٣}","المساحة = {frac:١|٢} × ٨ × ٤{sqrt:٣}","= ١٦{sqrt:٣}","الإجابة: ب (١٦{sqrt:٣})"]},"p247-q01":{"s":["المثلث الأول قائم وفيه زاوية ٣٠{deg} عند الرأس العلوي والقاعدة ٤ المقابلة لها","الضلع الرأسي = ٤ ÷ ظل ٣٠{deg} = ٤{sqrt:٣}","مساحته = {frac:١|٢} × ٤ × ٤{sqrt:٣} = ٨{sqrt:٣}","المثلث الثاني متساوي الأضلاع ضلعه ٤: ارتفاعه ٢{sqrt:٣}","مساحته = {frac:١|٢} × ٤ × ٢{sqrt:٣} = ٤{sqrt:٣}","الفرق = ٨{sqrt:٣} − ٤{sqrt:٣} = ٤{sqrt:٣}","الإجابة: ج (٤{sqrt:٣})"]},"p248-q01":{"s":["الضلعان من الرأس العلوي حتى المستقيم الأفقي متساويان: ٤ و ٤","المثلث العلوي متساوي الساقين فزاويتا قاعدته متساويتان وحادتان","الزاوية ١٢٠{deg} منفرجة فهي مكملة لزاوية القاعدة: زاوية القاعدة = ٦٠{deg}","المثلث متساوي الأضلاع وضلعه ٤","المساحة = {frac:١|٢} × ٤ × ٢{sqrt:٣}","= ٤{sqrt:٣}","الإجابة: ج (٤{sqrt:٣})"]},"p248-q02":{"s":["المثلث الأول متساوي الساقين (٥ و ٥) وقاعدته ٨: الارتفاع = ٥{^٢} − ٤{^٢} تحت الجذر = ٣","مساحته = {frac:١|٢} × ٨ × ٣ = ١٢","المثلث الثاني (٥ و ٥) وقاعدته ٦: الارتفاع = ٥{^٢} − ٣{^٢} تحت الجذر = ٤","مساحته = {frac:١|٢} × ٦ × ٤ = ١٢","القيمتان متساويتان","الإجابة: ج"]},"p248-q03":{"s":["المساحة = {frac:١|٢} × القاعدة × الارتفاع","٣٦ = {frac:١|٢} × ق × ٩","ق = ٣٦ × ٢ ÷ ٩ = ٨","القيمة الأولى ٨ والثانية ٨","الإجابة: ج (متساويتان)"]},"p249-q01":{"s":["نفرض القاعدة ل، فالارتفاع = ٣ل","المساحة = {frac:١|٢} × ل × ٣ل = ٢٤","٣ل{^٢} = ٤٨","ل{^٢} = ١٦","ل = ٤","الإجابة: ب (٤)"]},"p249-q02":{"s":["القاعدة ٦ والمثلث قائم، الارتفاع ع","المساحة = {frac:١|٢} × ٦ × ع = ١٨","ع = ٦","ظل س = ع ÷ ٦ = ١","س = ٤٥{deg}","الإجابة: ج (٤٥)"]},"p249-q03":{"s":["بعد مربعات الشبكة: المثلث ١ قائم، ساقه الأفقي ٣ مربعات وساقه الرأسي ٣ مربعات","مساحة المثلث ١ = {frac:١|٢} × ٣ × ٣ = ٤٫٥ وحدة مربعة","المثلث ٢ قائم، ساقه الأفقي مربعان وساقه الرأسي ٤ مربعات","مساحة المثلث ٢ = {frac:١|٢} × ٢ × ٤ = ٤ وحدات مربعة","٤٫٥ أكبر من ٤","الإجابة: أ (القيمة الأولى أكبر)"]},"p250-q01":{"s":["المثلث ١: الساق الرأسي س والأفقي ص، فمساحته = {frac:١|٢} × س × ص","المثلث ٢: الرأسي ٢س والأفقي ص ÷ ٢، فمساحته = {frac:١|٢} × ٢س × (ص ÷ ٢)","= {frac:١|٢} × س × ص","المساحتان متساويتان","الإجابة: ج"]},"p250-q02":{"s":["المساحة المشتركة = م (موجبة)","ارتفاع الأول = ٢م ÷ ٨ = م ÷ ٤","ارتفاع الثاني = ٢م ÷ ٥ = ٢م ÷ ٥","٢م ÷ ٥ أكبر من م ÷ ٤ (٠٫٤م أكبر من ٠٫٢٥م)","ارتفاع الثاني أكبر","الإجابة: ب"]},"p251-q02":{"s":["رؤوس المثلث: نقطة الأصل و (٦، ٠) و (٦، ٨)","القاعدة على المحور الأفقي = ٦ والارتفاع = ٨","المساحة = {frac:١|٢} × ٦ × ٨","= ٢٤","الإجابة: ب (٢٤)"]},"p252-q01":{"s":["ج عند نقطة الأصل وب على المحور الأفقي: ب = (٤، ٠)","أ تقع فوق منتصف القاعدة: الإحداثي الأفقي = ٢","الارتفاع = ٤ × {sqrt:٣} ÷ ٢ = ٢{sqrt:٣}","أ = (٢، ٢{sqrt:٣})","الإجابة: أ"]},"p252-q02":{"s":["المثلث قائم، الضلعان القائمان أ و ب والوتر ١٣","أ{^٢} + ب{^٢} = ١٦٩","أ + ب = ١٧ ← (أ + ب){^٢} = ٢٨٩","أ{^٢} + ٢ أ ب + ب{^٢} = ٢٨٩","١٦٩ + ٢ أ ب = ٢٨٩ ← أ ب = ٦٠","المساحة = {frac:١|٢} × أ × ب = ٣٠ م{^٢}","الإجابة: ج (٣٠)"]},"p253-q01":{"s":["المحيط = ٤(س − ١) + (س − ٢) + (٣س + ١)","= ٤س − ٤ + س − ٢ + ٣س + ١","= ٨س − ٥","٨س − ٥ = ٢٧","٨س = ٣٢","س = ٤","الأضلاع ١٢ و ٢ و ١٣ وتحقق متباينة المثلث","الإجابة: أ (٤)"]},"p254-q01":{"s":["زاوية الرأس الأيمن = ١٨٠ − ٨٠ − ٥٠ = ٥٠{deg}","زاويتا القاعدة أ ب (اليسرى) واليمنى متساويتان = ٥٠{deg}","الضلع المقابل لزاوية اليمنى (الضلع الأيسر) = الضلع المقابل لزاوية اليسرى (الضلع الأيمن) = ١٣","٨س − ٣ = ١٣ ← س = ٢","القاعدة = ٧ × ٢ + ٣ = ١٧","المحيط = ١٣ + ١٣ + ١٧ = ٤٣","الإجابة: ب (٤٣)"]},"p254-q02":{"s":["المحيط = ١٢ + ١٣ + {sqrt:س + ١} = ٢٨","{sqrt:س + ١} = ٣ ← س + ١ = ٩ ← س = ٨","القيمة الأولى = ٨ ÷ ٢ + ١ = ٥","القيمة الثانية = ٣ ÷ ٢ = ١٫٥","٥ أكبر من ١٫٥","الإجابة: أ (القيمة الأولى أكبر)"]},"p255-q02":{"s":["المثلث قائم وساقاه ٥ و ٥","الوتر = ٥{sqrt:٢} ≈ ٧٫٠٧","المحيط = ٥ + ٥ + ٥{sqrt:٢} ≈ ١٧٫٠٧","المساحة = {frac:١|٢} × ٥ × ٥ = ١٢٫٥","١٧٫٠٧ أكبر من ١٢٫٥ (مقارنة العددين كما يطلب السؤال)","الإجابة: أ (القيمة الأولى أكبر)"]},"p256-q01":{"s":["د منتصف أ ب: ب د = د أ = ٨ فـ أ ب = ١٦","ارتفاع المثلث الكبير = ٢ + ٦ = ٨","المثلث الداخلي غير المظلل رأسه على الارتفاع ٦ وقاعدته أ ب","مساحة الكبير = {frac:١|٢} × ١٦ × ٨ = ٦٤","مساحة الداخلي = {frac:١|٢} × ١٦ × ٦ = ٤٨","المظلل = ٦٤ − ٤٨ = ١٦","الإجابة: ج (١٦)"]},"p257-q01":{"s":["علامتا التساوي: ج ب = د ب","محيط أ ب ج = أ ب + ب ج + أ ج = ٢٤","أ ب + ب ج = ٢٤ − ٩ = ١٥","د أ = د ب + ب أ = ب ج + أ ب = ١٥","محيط أ ج د = أ ج + ج د + د أ","= ٩ + ٨ + ١٥","= ٣٢","الإجابة: أ (٣٢)"]},"p257-q02":{"s":["المستقيمان الأفقيان متوازيان فارتفاع المثلثين واحد: ع","مساحة أ ب ج = {frac:١|٢} × ٣ × ع = ١٫٥ع","مساحة د و ه = {frac:١|٢} × ٢ × ع = ع","١٫٥ع أكبر من ع","الإجابة: أ (القيمة الأولى أكبر)"]},"p258-q01":{"s":["المستقيمان م و ل متوازيان","المثلثان أ ب ج و د ج ب لهما القاعدة نفسها ج ب على ل","الرأسان أ و د على م فالارتفاع واحد","المساحة = {frac:١|٢} × ج ب × الارتفاع للمثلثين","المساحتان متساويتان","الإجابة: ج"]},"p258-q02":{"s":["المثلثان أ د ج و د أ ب قائمان عند أ","في كل منهما الساقان: أ د = س وأ ج = س (أو أ ب = س)","مساحة كل منهما = {frac:١|٢} × س × س","المساحتان متساويتان","الإجابة: ج"]},"p259-q01":{"s":["مساحة د ج ب = {frac:١|٢} × ج ب × الارتفاع = {frac:١|٢} × ٢س × س = س{^٢}","مساحة د ج أ = {frac:١|٢} × س × س = {frac:١|٢} س{^٢}","٢ × مساحة د ج أ = س{^٢}","المساحتان متساويتان","الإجابة: ج"]},"p259-q02":{"s":["المثلثان أ د ج و ب د ج لهما الرأس ج وارتفاع واحد على المستقيم ب أ","المساحتان تتناسبان مع القاعدتين أ د و ب د","لا يُعطى طول أ د ولا ب د ولا علامة تساوٍ","مثال: أ د = ب د ← المساحتان متساويتان","مثال: أ د = ٢ × ب د ← الأولى أكبر","الإجابة: د (المعطيات غير كافية)"]},"p260-q01":{"s":["علامة التساوي الواحدة على القطعتين أ ج و ج و من الضلع الأيمن، فـ أ ج = ج و = ل","المثلثان أ ج د و ج و د رأسهما د نفسه وقاعدتاهما أ ج و ج و على مستقيم واحد، فارتفاعهما واحد ع","مساحة أ ج د = {frac:١|٢} × ل × ع","مساحة ج و د = {frac:١|٢} × ل × ع","المساحتان متساويتان","الإجابة: ج"]},"p260-q02":{"s":["نفرض ب هـ = د ج = س فيكون هـ د = ٢س","للمثلثات الارتفاع نفسه ع من أ على المستقيم ج ب","مساحة أ ب هـ = {frac:١|٢} × س × ع، ومساحة أ د ج = {frac:١|٢} × س × ع","مجموعهما = س ع","مساحة أ هـ د = {frac:١|٢} × ٢س × ع = س ع","المقداران متساويان","الإجابة: ج"]},"p261-q01":{"s":["أ هـ عمودي على ج ب فهو ارتفاع المثلثين","مساحة أ ب هـ = {frac:١|٢} × هـ ب × أ هـ","مساحة أ ج هـ = {frac:١|٢} × هـ ج × أ هـ","المساحتان متساويتان، والارتفاع نفسه","فـ هـ ب = هـ ج","الإجابة: ج (متساويتان)"]},"p261-q02":{"s":["علامتا التساوي: د ج = ج ب، فـ د ب = ٢ د ج","هـ منتصف أ ج، فـ أ ج = ٢ هـ ج","المثلث غير المظلل د هـ ب قاعدته د ب وارتفاعه هـ ج: {frac:١|٢} × د ب × هـ ج = ٢٤","المثلث الكبير أ د ب: {frac:١|٢} × د ب × أ ج = {frac:١|٢} × د ب × ٢ هـ ج = ٢ × ٢٤ = ٤٨","المظلل = المثلث الكبير − المثلث د هـ ب = ٤٨ − ٢٤ = ٢٤","الإجابة: ب (٢٤)"]},"p262-q01":{"s":["أ و ب منتصفا س ص و س ع، فـ أ ب = {frac:١|٢} ع ص","نسمي الارتفاع الكلي للمثلث س ع ص: ر. ارتفاع المثلث ١ = {frac:١|٢} ر","الشكل الأوسط مستطيل فـ ل و = أ ب = {frac:١|٢} ع ص","علامتا التساوي: ع ل = و ص، فـ ع ل = و ص = {frac:١|٤} ع ص","ارتفاع المثلثين ٢ و ٣ = ارتفاع المستطيل = {frac:١|٢} ر","مساحة ١ = {frac:١|٢} × {frac:١|٢} ع ص × {frac:١|٢} ر = {frac:١|٨} × ع ص × ر","مساحة ٣ = {frac:١|٢} × {frac:١|٤} ع ص × {frac:١|٢} ر = {frac:١|١٦} × ع ص × ر، ومثلها مساحة ٢","مساحة ٢ + مساحة ٣ = {frac:١|٨} × ع ص × ر","القيمتان متساويتان","الإجابة: ج"]},"p262-q02":{"s":["المثلث متطابق الأضلاع فزواياه الثلاث متساوية","كل زاوية = ١٨٠ ÷ ٣ = ٦٠{deg}","جميع الزوايا حادة","الإجابة: أ (حاد الزوايا)"]},"p262-q03":{"s":["٦{^٢} + ٨{^٢} = ٣٦ + ٦٤ = ١٠٠ = ١٠{^٢}","فالمثلث قائم الزاوية والوتر ١٠","المثلث القائم المرسوم في دائرة وتره قطر","القطر = ١٠ ← نصف القطر = ٥","الإجابة: ب (٥)"]},"p263-q01":{"s":["أ ج = أ هـ + هـ ج = ٥ + ٢ = ٧","ج د = ج ب + ب د = ٣ + ٤ = ٧","مساحة أ ب ج = {frac:١|٢} × ٣ × ٧ = ١٠٫٥","مساحة د هـ ج = {frac:١|٢} × ٧ × ٢ = ٧","الفرق = ١٠٫٥ − ٧ = ٣٫٥","الإجابة: ب (٣٫٥)"]},"p263-q02":{"s":["المثلثان متساويا الساقين وزاويتا رأسيهما متساويتان (النجمتان)","فزوايا القاعدة متساوية والمثلثان متشابهان","نسبة التشابه: ج ب ÷ و هـ = ٢ ÷ ٨ = ١ ÷ ٤","أ ب = ٣٦ × ١ ÷ ٤ = ٩","الإجابة: ب (٩)"]},"p264-q01":{"s":["المثلث المظلل الأول: ساقاه ٤ (أفقي) و ٦ − ٤ = ٢ (رأسي)","مساحته = {frac:١|٢} × ٤ × ٢ = ٤","المثلث المظلل الثاني: ساقاه ٦ (أفقي) و ٨ − ٦ = ٢ (رأسي)","مساحته = {frac:١|٢} × ٦ × ٢ = ٦","المظلل = ٤ + ٦ = ١٠","الإجابة: أ (١٠)"]},"p264-q02":{"s":["في المثلث الصغير الأيمن: الضلعان القائمان ٣ و ٤","الوتر = {sqrt:٣{^٢} + ٤{^٢}} = {sqrt:٢٥} = ٥","هذا الوتر هو أيضا ضلع المثلث الكبير القائم عند رأسه السفلي","في المثلث الكبير الزاوية ٣٠{deg} مقابلة للضلع ٥","الضلع المقابل للزاوية ٣٠{deg} = {frac:١|٢} الوتر","س = ٢ × ٥ = ١٠","الإجابة: ب (١٠)"]},"p265-q01":{"s":["الزاوية الخارجية عند ب = ١٥٠{deg} فالداخلية = ١٨٠{deg} − ١٥٠{deg} = ٣٠{deg}","زاوية ج = ٦٠{deg} فزاوية أ = ١٨٠{deg} − ٦٠{deg} − ٣٠{deg} = ٩٠{deg}","الضلع المقابل لـ ٣٠{deg} هو أ ج = ٤","الضلع المقابل لـ ٣٠{deg} = {frac:١|٢} الوتر","ب ج = ٢ × ٤ = ٨","تحقق: أ ب = ب ج × جا ٦٠{deg} = ٨ × {sqrt:٣} ÷ ٢ = ٤{sqrt:٣}","الإجابة: ب (٨)"]},"p265-q02":{"s":["المثلث قائم عند أ والوتر = ١٤ والزاوية ٣٠{deg} في الرأس العلوي","أ ب هو الضلع المقابل للزاوية ٣٠{deg}","أ ب = {frac:١|٢} × ١٤ = ٧","تحقق: الضلع الآخر = ٧{sqrt:٣} ويطابق المعطى","الإجابة: ج (٧)"]},"p266-q02":{"s":["د ج و هـ ب كلاهما عمودي على ج أ","فهما متوازيان والمثلثان أ ب هـ و أ ج د متشابهان","{frac:أ ب|أ ج} = {frac:ب هـ|ج د} = {frac:٤|٦}","أ ب = ٩ × {frac:٤|٦} = ٦","الإجابة: أ (٦)"]},"p267-q02":{"s":["في المثلث السفلي القائم: الضلعان ٣ و ٤","الوتر = {sqrt:٩ + ١٦} = ٥","علامة التساوي: الجزء العلوي من الضلع الرأسي = هذا الوتر = ٥","المنطقة س مثلث قاعدته الجزء العلوي ٥","ارتفاعه = البعد الأفقي = ٣","المساحة = {frac:١|٢} × ٥ × ٣ = ٧٫٥","الإجابة: ب (٧٫٥)"]},"p268-q01":{"s":["المثلث العلوي الأيسر قائم ومتساوي الساقين وساقاه ٤ و٤ (من الرسم)، فـ أ ج = {sqrt:٤{^٢} + ٤{^٢}} = ٤{sqrt:٢}","أ ج ⊥ أ ب فالمساحة = {frac:١|٢} × أ ج × أ ب","= {frac:١|٢} × ٤{sqrt:٢} × ٧ = ١٤{sqrt:٢}","الإجابة: د (١٤{sqrt:٢})"]},"p268-q02":{"s":["نفرض القاعدة س فيكون الارتفاع س + ١","المساحة: {frac:١|٢} × س × (س + ١) = ٢١","س(س + ١) = ٤٢","٦ × ٧ = ٤٢ فـ س = ٦ (القاعدة موجبة)","الارتفاع = ٦ + ١ = ٧","الإجابة: د (٧)"]},"p312-q01":{"s":["أ ب قطر والنقطة ج على الدائرة فالزاوية عند ج قائمة (مرسومة في الشكل)","أ ب{^٢} = أ ج{^٢} + ب ج{^٢}","أ ب{^٢} = ١٢{^٢} + ٥{^٢} = ١٤٤ + ٢٥ = ١٦٩","أ ب = ١٣ ← القطر = ١٣","المحيط = ط × القطر = ١٣ ط","الإجابة: أ (١٣ ط)"]},"p312-q02":{"s":["المربع داخل الدائرة ورؤوسه على الدائرة، فقطر المربع هو قطر الدائرة","القطر{^٢} = ١٠{^٢} + ١٠{^٢} = ٢٠٠","نصف القطر{^٢} = ٢٠٠ ÷ ٤ = ٥٠","مساحة الدائرة = ط × نق{^٢} = ٥٠ ط","الإجابة: أ (٥٠ ط)"]},"p313-q01":{"s":["القطر المرسوم في المربع = قطر الدائرة = ١٠","في المربع: القطر{^٢} = ٢ × الضلع{^٢}","١٠٠ = ٢ × الضلع{^٢} ← الضلع{^٢} = ٥٠","مساحة المربع = الضلع{^٢} = ٥٠","الإجابة: ب (٥٠)"]},"p313-q02":{"s":["أكبر دائرة داخل المربع تمس أضلاعه الأربعة","قطرها = ضلع المربع = ١٠","نصف القطر = ٥","المساحة = ط × ٥{^٢} = ٢٥ ط","الإجابة: أ (٢٥ ط)"]},"p313-q03":{"s":["مساحة المربع = ١٠{^٢} = ١٠٠","الدائرة تمس أضلاع المربع فنصف قطرها = ٥","مساحة الدائرة = ٢٥ ط","المظلل = ١٠٠ − ٢٥ ط (القيمة الدقيقة)","بأخذ ط ≈ ٣٫١٤: ٢٥ ط ≈ ٧٨٫٥","المظلل ≈ ١٠٠ − ٧٨٫٥ = ٢١٫٥","الإجابة: ج (٢١٫٥)"]},"p314-q01":{"s":["الدائرة تمس أضلاع المربع، نصف قطرها = ٥ (ضلع المربع ١٠)","مجموع الأجزاء الأربعة بين المربع والدائرة = ١٠٠ − ٢٥ ط","المظلل الجزءان العلويان فقط = نصف ذلك","= ٥٠ − ١٢٫٥ ط","بأخذ ط ≈ ٣٫١٤: ١٢٫٥ ط ≈ ٣٩٫٢٥","المظلل ≈ ٥٠ − ٣٩٫٢٥ = ١٠٫٧٥","الإجابة: ب (١٠٫٧٥)"]},"p314-q02":{"s":["المسافة في لفة واحدة = محيط الدائرة = ط × القطر","= ط × ٨٥ ≈ ٣٫١٤ × ٨٥ ≈ ٢٦٧","دار مرتين: ٢ × ٢٦٧ ≈ ٥٣٤ متر","أقرب خيار هو ٥٣٠ متر (والسؤال يقول بالتقريب)","الإجابة: أ (٥٣٠ متر)"]},"p315-q01":{"s":["قطر الدائرة = ٢{sqrt:٢} فنصف القطر = {sqrt:٢}","الزاوية ١٣٥{deg} بين الشعاع الأيسر من القطر وأحد نصفي القطر المائل","فالزاوية عند المركز في المثلث الأيمن = ١٨٠{deg} − ١٣٥{deg} = ٤٥{deg}","المثلث قائم وزاويته ٤٥{deg} فهو متساوي الساقين ووتره نصف القطر {sqrt:٢}","الساق = {sqrt:٢} ÷ {sqrt:٢} = ١","مساحة المثلث = {frac:١|٢} × ١ × ١ = {frac:١|٢}","المثلث الأيسر على استقامة النصف القطري نفسه فزاويته عند المركز ٤٥{deg} أيضا (متقابلتان بالرأس) ومساحته {frac:١|٢}","المجموع = {frac:١|٢} + {frac:١|٢} = ١","الإجابة: أ (١)"]},"p316-q01":{"s":["الدائرة الأولى: ط × نق{^٢} = ٩ ط ← نق = ٣","الدائرة الثانية: ٢ ط × نق = ٩ ط ← نق = ٤٫٥","٤٫٥ > ٣","الإجابة: ب (القيمة الثانية أكبر)"]},"p317-q01":{"s":["محيط الدائرة = ١٦ ط (القيمة الأولى)","ط > ٣ فالقيمة الأولى > ٤٨","المثلث قائم عند م وساقاه نصفا قطر = ٨ و ٨","مساحته = {frac:١|٢} × ٨ × ٨ = ٣٢","٤٨ > ٣٢","الإجابة: أ (القيمة الأولى أكبر)"]},"p317-q02":{"s":["عرض المستطيل = س وطوله ٤س","٤س × س = ٣٦ ← س{^٢} = ٩ ← س = ٣","م مركز الدائرة وهي عند ركن المستطيل (النقطة م مرسومة) والضلع السفلي يمس الدائرة عند نهاية القطر الرأسي من م","فعرض المستطيل = نصف القطر = ٣","القطر = ٦","الإجابة: ب (٦)"]},"p317-q03":{"s":["محيط الخماسي المنتظم = ٥ × ١ = ٥","محيط الدائرة = ٢ ط × ١ = ٢ ط","ط > ٣ فـ ٢ ط > ٦","٦ > ٥","الإجابة: ب (القيمة الثانية أكبر)"]},"p318-q01":{"s":["مساحة المربع = ١٤٤ فضلعه = ١٢","٣ دوائر في كل صف تملأ العرض (الدوائر متماسة وتمس الأضلاع في الشكل)","قطر الدائرة = ١٢ ÷ ٣ = ٤ ← نصف القطر = ٢","مساحة الدائرة = ط × ٢{^٢} = ٤ ط","المظلل أربع دوائر في الأركان = ٤ × ٤ ط = ١٦ ط","الإجابة: د (١٦ ط)"]},"p318-q02":{"s":["ربع الدائرة نصف قطره ٤ (القائمة عند المركز)","مساحة الدائرة الكاملة = ط × ٤{^٢} = ١٦ ط","ربع الدائرة = {frac:١|٤} × ١٦ ط = ٤ ط","الإجابة: أ (٤ ط)"]},"p319-q01":{"s":["الركن القائم للمستطيل هو مركز ربع الدائرة، والركن المقابل على القوس (ظاهر من تظليل الشرائح فقط خارج المستطيل)","قطر المستطيل = نصف قطر ربع الدائرة","نق{^٢} = ٦{^٢} + ٨{^٢} = ١٠٠ ← نق = ١٠","مساحة ربع الدائرة = {frac:١|٤} × ط × ١٠٠ = ٢٥ ط","مساحة المستطيل = ٦ × ٨ = ٤٨","المظلل = ٢٥ ط − ٤٨","الإجابة: ب (٢٥ ط − ٤٨)"]},"p319-q02":{"s":["عرض الباب = ٤ م = قطر نصف الدائرة (الخط الأفقي المرسوم بنقطة المركز)","نصف القطر = ٢","مساحة نصف الدائرة = {frac:١|٢} × ط × ٢{^٢} = ٢ ط","الإجابة: ب (٢ ط)"]},"p320-q02":{"s":["الخط الرأسي المرسوم قطر للدائرة الصغيرة وهو يصل قمة القوس بمنتصف القاعدة، فقطرها = نصف قطر نصف الدائرة الكبيرة","السهم ٨ سم يمثل من طرف القاعدة إلى الخط الرأسي أي نصف القطر الكبير = ٨","قطر الدائرة الصغيرة = ٨ ← نصف قطرها = ٤","مساحتها = ط × ٤{^٢} = ١٦ ط","الإجابة: ج (١٦ ط)"]},"p321-q01":{"s":["نصف القطر الكبير = ٨ (السهم ٨ سم)","مساحة نصف الدائرة الكبيرة = {frac:١|٢} × ط × ٨{^٢} = ٣٢ ط","قطر الدائرة الصغيرة = ٨ ← نصف قطرها ٤","مساحتها = ط × ٤{^٢} = ١٦ ط","المظلل = ٣٢ ط − ١٦ ط = ١٦ ط","الإجابة: ج (١٦ ط)"]},"p321-q02":{"s":["القائمة عند المركز وكل ساق نصف قطر = ٦","مساحة ربع الدائرة = {frac:١|٤} × ط × ٦{^٢} = ٩ ط","مساحة المثلث = {frac:١|٢} × ٦ × ٦ = ١٨","المظلل = ٩ ط − ١٨","الإجابة: أ (٩ ط − ١٨)"]},"p322-q01":{"s":["الزاوية المركزية ٦٠{deg} ونصف القطر ٦","مساحة القطاع = {frac:٦٠|٣٦٠} × ط × ٦{^٢} = ٦ ط","المثلث متساوي الساقين رأسه ٦٠{deg} وساقاه نصفا قطر فهو متساوي الأضلاع وضلعه ٦","مساحته = {frac:{sqrt:٣}|٤} × ٦{^٢} = ٩{sqrt:٣}","المظلل = القطاع − المثلث = ٦ ط − ٩{sqrt:٣}","الإجابة: ج (٦ ط − ٩{sqrt:٣})"]},"p323-q02":{"s":["علامات التساوي تدل على أن الأضلاع الثلاثة للمثلث متساوية فهو متساوي الأضلاع","الضلع = ٢٤ ÷ ٣ = ٨","مساحة المثلث = {frac:{sqrt:٣}|٤} × ٨{^٢} = ١٦{sqrt:٣}","قطر نصف الدائرة = الضلع العلوي = ٨ ← نصف القطر ٤","مساحة نصف الدائرة = {frac:١|٢} × ط × ٤{^٢} = ٨ ط","المساحة الكلية = ١٦{sqrt:٣} + ٨ ط = ٨(٢{sqrt:٣} + ط)","الإجابة: أ"]},"p324-q01":{"s":["الجزء المأخوذ نصف دائرة قطرها = ٢ (السهم ٢ م على ضلع المستطيل الأيسر)","عرض المستطيل = ٢ وطوله ٤","المحيط = الضلع العلوي + الضلع الأيمن + الضلع السفلي + القوس","= ٤ + ٢ + ٤ + القوس","القوس = نصف محيط الدائرة = ط × ١ = ط","المحيط = ١٠ + ط","الإجابة: ب (١٠ + ط)"]},"p324-q02":{"s":["أ د و أ ج نصفا قطر فالمثلث أ د ج متساوي الساقين","العلامة ٣٠{deg} عند الرأس د بين الضلعين (قراءة الرسم: ≈٣٢{deg} عند د و≈١٥٧{deg} عند أ)","زاويتا القاعدة متساويتان: ق(ج أ د) = ١٨٠ − ٣٠ − ٣٠ = ١٢٠{deg}","الزاوية ب أ د قائمة = ٩٠{deg}","س = ق(ب أ ج) = ٣٦٠ − ٩٠ − ١٢٠ = ١٥٠{deg}","الإجابة: ج (١٥٠)"]},"p325-q01":{"s":["الدائرتان متطابقتان وتمسان بعضهما وأضلاع المستطيل (كما في الرسم)","ارتفاع المستطيل = قطر الدائرة = ٢","العرض = قطرا الدائرتين = ٢ + ٢ = ٤","المساحة = ٤ × ٢ = ٨","الإجابة: د (٨)"]},"p325-q02":{"s":["الدائرتان متطابقتان وتمسان الأضلاع (كما في الرسم) وقطر كل منهما ٢ فنصف القطر ١","مساحة المستطيل = ٤ × ٢ = ٨","مساحة الدائرتين = ٢ × ط × ١{^٢} = ٢ ط","المظلل = ٨ − ٢ ط","الإجابة: ج (٨ − ٢ ط)"]},"p325-q03":{"s":["الشرط من الشكل: الدوائر الثلاث متطابقة ومتماسة، وكل منها تمس الضلعين العلوي والسفلي، وتمس الأولى والثالثة الضلعين الجانبيين","مساحة الدائرة = ٩ط ← نق{^٢} = ٩ ← نق = ٣","القطر = ٦","م ن = من مركز الأولى إلى مركز الثالثة = قطر + قطر = ٦ + ٦ = ١٢","الإجابة: ج (١٢)"]},"p326-q01":{"s":["٤ دوائر متطابقة داخل مربع ضلعه ٨ وتمس الأضلاع وبعضها (كما في الرسم)","قطر الدائرة = ٨ ÷ ٢ = ٤ ← نصف القطر ٢","مساحة الدائرة = ٤ ط","مساحة الدوائر الأربع = ١٦ ط","المظلل = ٦٤ − ١٦ ط","الإجابة: ج (٦٤ − ١٦ ط)"]},"p326-q02":{"s":["مراكز الدوائر الثلاث رؤوس مثلث متساوي الأضلاع ضلعه ٢ (الدوائر متماسة كما في الرسم)","زاوية كل رأس ٦٠{deg} فكل قوس من أقواس الجزء المظلل ٦٠{deg}","طول القوس = {frac:٦٠|٣٦٠} × ٢ ط × ١ = {frac:ط|٣}","المحيط = ٣ × {frac:ط|٣} = ط","الإجابة: أ (ط)"]},"p326-q03":{"s":["مراكز الدوائر رؤوس مثلث متساوي الأضلاع ضلعه ٢ × ٢ = ٤ (الدوائر متماسة كما في الرسم)","مساحته = {frac:{sqrt:٣}|٤} × ٤{^٢} = ٤{sqrt:٣}","الأقطاع الثلاثة زاوية كل منها ٦٠{deg} ونصف القطر ٢","مساحتها معا = ٣ × {frac:٦٠|٣٦٠} × ط × ٢{^٢} = ٢ ط","المظلل = ٤{sqrt:٣} − ٢ ط","الإجابة: ب"]},"p327-q01":{"s":["٤ دوائر متطابقة في مربع ضلعه ٨ وتمس الأضلاع وبعضها","القطر = ٤ ونصف القطر = ٢","مراكز الدوائر رؤوس مربع ضلعه ٤","مساحة المظلل = مساحة المربع الصغير − ٤ أرباع دوائر = ١٦ − ٤ ط","الإجابة: أ (١٦ − ٤ ط)"]},"p327-q02":{"s":["محيط الدائرة = ٢ ط نق = ٣٦ ط ← نق = ١٨","مراكز الدوائر رؤوس مربع ضلعه ٢ نق = ٣٦ (الدوائر متماسة)","حدود المظلل أربعة أقواس كل منها ربع محيط دائرة","المحيط = ٤ × {frac:١|٤} × ٣٦ ط = ٣٦ ط","الإجابة: أ (٣٦ ط)"]},"p330-q01":{"s":["نصف قطر الدائرة الصغيرة = ١ ← قطرها ٢","نصف قطر الدائرة الوسطى = ٢ ← قطرها ٤","الدائرتان متماستان وقطراهما على القطر الرأسي للدائرة الكبيرة (كما في الرسم)","قطر الكبيرة = ٢ + ٤ = ٦ ← نصف قطرها ٣","المساحة = ط × ٣{^٢} = ٩ ط","الإجابة: ج (٩ ط)"]},"p330-q02":{"s":["نصف القطر ١ و٢ مكتوبان في الرسم، وقطر الكبيرة = ٢ + ٤ = ٦ (كما في p٣٣٠-q٠١)","نصف قطر الكبيرة = ٣","مساحة الدائرة م = ط × ١{^٢} = ط","مساحة الكبيرة = ٩ ط","النسبة = ط : ٩ ط = ١ : ٩","الإجابة: ب (١:٩)"]},"p331-q02":{"s":["الدائرتان متطابقتان، والمقطع المرسوم من كل مركز إلى محيطه = ٦ فنصف القطر ٦","العدد ٤ مكتوب داخل منطقة التقاطع على القطعة م ن، فهو عرض التقاطع على هذه القطعة (كما في الرسم)","طول التقاطع = ٦ + ٦ − م ن = ٤","م ن = ١٢ − ٤ = ٨","الإجابة: ب (٨)"]},"p331-q03":{"s":["نسبة المساحتين = {frac:ط نق١{^٢}|ط نق٢{^٢}} = ١ : ١٤٤","إذن {frac:نق١{^٢}|نق٢{^٢}} = {frac:١|١٤٤}","نسبة نصفي القطرين = {sqrt:١} : {sqrt:١٤٤} = ١ : ١٢","الإجابة: ب (١:١٢)"]},"p331-q04":{"s":["لتكن ر نصف قطر الدائرة وس ضلع المربع","{frac:ط ر{^٢}|س{^٢}} = {frac:١|٤}","{frac:ر{^٢}|س{^٢}} = {frac:١|٤ ط}","{frac:ر|س} = {frac:١|٢{sqrt:ط}}","الإجابة: ب","هذه الصيغة (١ على ٢ جذر ط) هي قراءة الخيار ب من الصورة؛ العدد ٢ خارج الجذر."]},"p332-q01":{"s":["الدائرة: ٢ ط × ٤ = ٨ ط ≈ ٢٥٫١ سم (ط≈٣٫١٤)","المستطيل: ٢ × (٨ + ١٤) = ٤٤ سم","المثلث المتطابق الأضلاع: ٣ × ٩ = ٢٧ سم","المربع: ٤ × ٨ = ٣٢ سم","الأكبر: المستطيل = ٤٤","الإجابة: ب"]},"p332-q02":{"s":["مركز الدائرة عند رأس المستطيل وضلعه يمس الدائرة (كما في الرسم)، والمظلل ربع دائرة","مساحة الدائرة = ٤ × ١٠ = ٤٠","مساحة المستطيل = مساحة الدائرة = ٤٠","الإجابة: ج (٤٠)"]},"p332-q03":{"s":["محيط ن = ٢ ط × ٣ = ٦ ط","محيط م = ٣ × ٦ ط = ١٨ ط","نصف قطر م = ١٨ ط ÷ ٢ ط = ٩","مساحة م = ط × ٩{^٢} = ٨١ ط","القيمة الثانية = ٦٠ ط","٨١ ط > ٦٠ ط فالقيمة الأولى أكبر","الإجابة: أ"]},"p333-q02":{"s":["ط نق{^٢} = ٣٫١٤ مع ط ≈ ٣٫١٤ ← نق{^٢} = ١ ← نق = ١","المحيط = ٢ ط نق = ٢ × ٣٫١٤ × ١ = ٦٫٢٨","الإجابة: ب (٦٫٢٨)"]},"p333-q03":{"s":["ط نق{^٢} = ٣١٤ مع ط ≈ ٣٫١٤ ← نق{^٢} = ١٠٠ ← نق = ١٠","المحيط = ٢ × ٣٫١٤ × ١٠ = ٦٢٫٨","الإجابة: ج (٦٢٫٨)"]},"p333-q04":{"s":["٢ ط نق = ٣٫١٤ مع ط ≈ ٣٫١٤ ← نق = {frac:١|٢}","المساحة = ط × {frac:١|٤} = {frac:١|٤} ط","الإجابة: د ({frac:١|٤} ط)"]},"p334-q01":{"s":["الزوايا الثلاث المكتوبة ٩٠{deg} في القطاعات غير المظللة، مجموعها ٢٧٠{deg}","المظللة تساوي ٣٦٠{deg} − ٢٧٠{deg} = ٩٠{deg}","مساحة الدائرة = ط × ٤{^٢} = ١٦ ط","المظلل = {frac:٩٠|٣٦٠} × ١٦ ط = ٤ ط","الإجابة: ب (٤ ط)"]},"p334-q02":{"s":["القطاع غير المظلل زاويته ٦٠{deg}","المظلل ٣٦٠{deg} − ٦٠{deg} = ٣٠٠{deg} أي {frac:٥|٦} الدائرة","مساحة الدائرة = ط × ٣{^٢} = ٩ ط","المظلل = {frac:٥|٦} × ٩ ط = {frac:١٥|٢} ط","الإجابة: د"]},"p335-q01":{"s":["نضرب المعادلة في ٢: س{^٢} + ص{^٢} = ٣٦","هذه دائرة مركزها نقطة الأصل ونق{^٢} = ٣٦ أي نق = ٦","المساحة = ط × ٦{^٢} = ٣٦ ط","الإجابة: ج"]},"p335-q03":{"s":["التعريف المعتاد: المربع مستطيل خاص، فالمستطيل يشمل المربع","نفرض محيط المربع = محيط المستطيل = ١٦","المربع: ضلعه ٤ ومساحته ١٦","إن كان المستطيل مربعا (٤ × ٤): مساحته ١٦ فالقيمتان متساويتان","إن لم يكن مربعا (٢ × ٦): مساحته ١٢ فالقيمة الأولى أكبر","النتيجة تتغير حسب أبعاد المستطيل فلا تتحدد المقارنة","الإجابة: د (المعلومات غير كافية)"],"k":3},"p335-q04":{"s":["نفرض المحيط المشترك = ٣٢","ضلع المربع = ٨ ومساحته = ٦٤","نق = ٣٢ ÷ (٢ط) = {frac:١٦|ط} ومساحة الدائرة = ط × {frac:٢٥٦|ط{^٢}} = {frac:٢٥٦|ط} ≈ ٨١٫٥ (ط≈٣٫١٤)","عموما: مساحة الدائرة = {frac:م{^٢}|٤ط} ومساحة المربع = {frac:م{^٢}|١٦} و ٤ط < ١٦ فمساحة الدائرة أكبر","الإجابة: أ"]},"p336-q01":{"s":["نفرض المحيطين = ١٢","مستطيل ٢ × ٤ مساحته ٨ ومثلث متساوي الأضلاع ضلعه ٤ مساحته ٤{sqrt:٣} ≈ ٦٫٩: القيمة الأولى أكبر","مستطيل ١ × ٥ مساحته ٥ ومثلث متساوي الأضلاع ضلعه ٤ مساحته ≈ ٦٫٩: القيمة الثانية أكبر","النتيجة تتغير فالمعطيات غير كافية","الإجابة: د"]},"p336-q02":{"s":["القسمان متساويان فمحيط الدائرة = محيط المستطيل = ل (مثلا ١٦)","مساحة الدائرة = {frac:ل{^٢}|٤ ط} ≈ ٢٠٫٤ (ط≈٣٫١٤)","أكبر مساحة لمستطيل بهذا المحيط هي للمربع: ٤ × ٤ = ١٦","إذن مساحة الدائرة أكبر من مساحة أي مستطيل","الإجابة: أ"]},"p336-q03":{"s":["القسمان متساويان فمحيط المربع = محيط شبه المنحرف = ١٦ (مثلا)","مساحة المربع = ٤ × ٤ = ١٦","مساحة أي رباعي محيطه ١٦ لا تزيد عن ١٦ ولا تساويها إلا للمربع (أكبر مساحة لمحيط ثابت هي للمربع)","شبه المنحرف (له ضلعان متوازيان فقط) ليس مربعا فمساحته أقل","الإجابة: أ"]},"p336-q04":{"s":["القسمان متساويان في الطول فمحيط المربع = محيط المستطيل","الإجابة: ج (القيمتان متساويتان)"]},"p337-q01":{"s":["م مركز الدائرة وزاوية أ م ب قائمة (كما في الرسم) وم ب = ٢","م أ = م ب = ٢ لأنهما نصفا قطر","أ ب = {sqrt:٢{^٢} + ٢{^٢}} = {sqrt:٨} = ٢{sqrt:٢}","الإجابة: ب"]},"p338-q02":{"s":["العمود من المركز على الوتر يُنصّفه (علامة التساوي في الرسم)","البعد عن المركز = ٣ ونصف القطر = ٥","نصف الوتر = {sqrt:٥{^٢} − ٣{^٢}} = ٤","أ ب = ٢ × ٤ = ٨","الإجابة: ب"]},"p339-q02":{"s":["المستقيم الرأسي قطر والصفوف أشرطة أفقية، كل شريط جزآه الأيمن والأيسر متطابقان بالانعكاس","في كل شريط أحد الجزأين مظلل والآخر غير مظلل","إذن المظلل = نصف مساحة كل شريط = نصف الدائرة","النسبة = {frac:١|٢}","الإجابة: أ"]},"p340-q01":{"s":["قطر المربع = قطر الدائرة = ١٤ فنق = ٧","مساحة الدائرة = {frac:٢٢|٧} × ٧{^٢} = ١٥٤","مساحة المربع = {frac:١|٢} × ١٤{^٢} = ٩٨","المظلل = ١٥٤ − ٩٨ = ٥٦","الإجابة: ب (٥٦)"]},"p340-q02":{"s":["م مركز الدائرة وطرفا القاعدة على الدائرة (كما في الرسم)","ضلعا المثلث نصفا قطر فهما متساويان","زاويتا القاعدة س وص متساويتان","الإجابة: ج (القيمتان متساويتان)"]},"p341-q01":{"s":["القطاع زاويته ٤٥{deg} من الرسم، مساحته = {frac:٤٥|٣٦٠} × ٤٠ ط = ٥ ط","القطاع جزء من المثلث","المظلل = مساحة المثلث − القطاع = ٢٠ − ٥ ط","الإجابة: ج"]},"p341-q02":{"s":["خطا أ جـ وب هـ يمران بالمركز م (كما في الرسم)","م جـ = م هـ فالمثلث م جـ هـ متساوي الساقين","ق(م هـ جـ) = (١٨٠ − ١١٠) ÷ ٢ = ٣٥{deg}","ق(أ م ب) = ق(جـ م هـ) = ١١٠{deg} (زاويتان متقابلتان بالرأس)","م أ = م ب فق(أ ب م) = (١٨٠ − ١١٠) ÷ ٢ = ٣٥{deg}","القيمتان متساويتان","الإجابة: ج"]},"p343-q01":{"s":["الزاوية ١٣٥{deg} هي زاوية القطاع العلوي غير المظلل (كما في الرسم)","القطاع السفلي يقابله بالرأس فزاويته ١٣٥{deg} أيضا","القطاعان المظللان مجموع زاويتيهما = ٣٦٠ − ٢ × ١٣٥ = ٩٠{deg}","مساحتهما = {frac:٩٠|٣٦٠} × ط × ٤{^٢} = ٤ ط","الإجابة: د"]},"p188-q01":{"s":["الأضلاع ٥ و٦ و٧ ونقارن مربع أكبر ضلع بمجموع مربعي الضلعين الآخرين","٧{^٢} = ٤٩ و ٥{^٢} + ٦{^٢} = ٦١","٤٩ < ٦١ فالزاوية المقابلة لأكبر ضلع حادة، وبالتالي كل الزوايا حادة","الإجابة: أ (حاد الزوايا)"]},"p188-q03":{"s":["المثلث المتطابق الأضلاع تتساوى زواياه الثلاث","كل زاوية = ١٨٠ ÷ ٣ = ٦٠{deg} وهي حادة","الإجابة: أ (حاد الزوايا)"]},"p188-q04":{"s":["المسافة = جذر (مربع فرق السينات + مربع فرق الصادات)","الفرق بين الإحداثيين الأولين ٨ وبين الثانيين ٦ (ترتيب الإحداثين داخل القوس لا يغيّر النتيجة)","المسافة = {sqrt:٨{^٢} + ٦{^٢}} = {sqrt:١٠٠} = ١٠","الإجابة: ج"]},"p189-q01":{"s":["م منتصف أ ب فإحداثيا م هما متوسطا إحداثيي أ و ب","أحد الإحداثيين المشتركين: (٦ + ص) ÷ ٢ = ٩ فـ ص = ١٢","الإحداثي الآخر: (س + ٣) ÷ ٢ = ٥ فـ س = ٧","نقارن: س = ٧ و ص = ١٢","القيمة الثانية أكبر","الإجابة: ب"]},"p190-q01":{"s":["طول القوس = {frac:قياس الزاوية المركزية|٣٦٠} × المحيط","= {frac:٣٦|٣٦٠} × ١٠٠ = ١٠","الإجابة: ب"]},"p190-q02":{"s":["طول القوس = {frac:٦٠|٣٦٠} × ٢ ط × ٥","= {frac:١|٦} × ١٠ ط = {frac:٥|٣} ط","الإجابة: أ"]},"p191-q01":{"s":["قياس القوس = قياس الزاوية المركزية التي تقابله","الزاوية المركزية = ٦٠{deg} فقياس القوس أ ب = ٦٠{deg}","الإجابة: أ"]},"p191-q02":{"s":["أ ب قطر (يمر بالمركز م) فالزاوية المحيطية أ ج ب = ٩٠{deg} لأنها في نصف دائرة","علامتا التساوي على القوسين ب ج و ج أ فالوتران ب ج = ج أ","المثلث أ ب ج قائم ومتساوي الساقين فزاويتا القاعدة متساويتان","س = (١٨٠ − ٩٠) ÷ ٢ = ٤٥{deg}","الإجابة: ج"]},"p192-q02":{"s":["الزاويتان متتامتان: ق(أ) + ق(ب) = ٩٠","(٣س − ٨) + (٥س + ١٠) = ٩٠","٨س + ٢ = ٩٠ فـ ٨س = ٨٨ و س = ١١","ق(أ) = ٣ × ١١ − ٨ = ٢٥{deg} وق(ب) = ٥ × ١١ + ١٠ = ٦٥{deg}","الصغرى = ٢٥{deg}","الإجابة: أ"]},"p192-q03":{"s":["الزاويتان متكاملتان: أ + ب = ١٨٠","(س − ٥٠) + (٢س + ٢٠) = ١٨٠","٣س − ٣٠ = ١٨٠ فـ س = ٧٠","ب = ٢ × ٧٠ + ٢٠ = ١٦٠{deg}","الإجابة: د"]},"p193-q01":{"s":["النقطتان على الضلعين متساويتا الزاوية (علامتا النقطة) فـ و منصف للزاوية العلوية","نظرية منصف الزاوية: {frac:س|٢} = {frac:٨|٥}","س = {frac:١٦|٥} = ٣٫٢","الإجابة: ب"]},"p193-q02":{"s":["الزاويتان س و س متساويتان على جانبي القطعة الرأسية من الرأس","فالقطعة الرأسية منصف زاوية الرأس","نظرية منصف الزاوية: {frac:٣|ص} = {frac:٥|٧}","٥ص = ٢١ فـ ص = ٤٫٢","الإجابة: د (٤٫٢)"]},"p194-q01":{"s":["علامات التساوي تبين أن طرفي القطعة س ص منتصفا الضلعين","القطعة الواصلة بين منتصفي ضلعين توازي الضلع الثالث وتساوي نصفه","س ص = {frac:١|٢} × ١٠ = ٥","الإجابة: ج"]},"p194-q02":{"s":["علامتا التساوي على أ هـ و هـ ب فـ هـ منتصف أ ب","زاوية أ قائمة وزاوية د هـ ب قائمة فـ هـ د ∥ أ ج","د منتصف ب ج، وهـ د = {frac:١|٢} أ ج","هـ د = {frac:١|٢} × ٣ = ١٫٥","الإجابة: أ"]},"p195-q01":{"s":["أ و ب و ج منتصفات الأضلاع، فكل قطعة تصل بين منتصفي ضلعين توازي الضلع الثالث وتساوي نصفه","أ ب تصل منتصفي ص د و ص س فهي = {frac:١|٢} س د","س ج = {frac:١|٢} س د لأن ج منتصف س د","س ج = أ ب","الإجابة: ج"]},"p195-q02":{"s":["ل ج ∥ ع ك فهما يقطعان الضلعين بأجزاء متناسبة","{frac:٤|س} = {frac:٦|٣}","٦س = ١٢ فـ س = ٢","الإجابة: أ"]},"p196-q01":{"s":["الخطان المرسومان متوازيان (علامتا السهم) فالأجزاء على الضلعين متناسبة","{frac:٢س − ١|٣} = {frac:س + ٣|٥}","٥(٢س − ١) = ٣(س + ٣)","١٠س − ٥ = ٣س + ٩","٧س = ١٤ فـ س = ٢","الإجابة: أ"]},"p196-q02":{"s":["الزاوية الخارجية = مجموع الزاويتين الداخليتين البعيدتين عنها","٢س + س = ١٢٠","٣س = ١٢٠ فـ س = ٤٠{deg}","الإجابة: د"]},"p197-q01":{"s":["أ ج د زاوية خارجية للمثلث عند ج","الزاوية الخارجية = مجموع الزاويتين الداخليتين البعيدتين عنها = أ + ب","القيمتان متساويتان","الإجابة: ج"]},"p197-q02":{"s":["١٢٠{deg} زاوية خارجية للمثلث عند الرأس الأيمن، والزاويتان س و ص هما الداخليتان البعيدتان","س + ص = ١٢٠","القيمة الأولى ١٢٠ أكبر من ١١٩","الإجابة: أ"]},"p198-q01":{"s":["في المثلث القائم الزاوية المجاورة للقائمة: ص = ٩٠ − ٣٠ = ٦٠{deg}","س زاوية خارجية متممة لـ ص على المستقيم: س = ١٨٠ − ٦٠ = ١٢٠{deg}","{frac:١|٢} س = ٦٠{deg}","القيمتان متساويتان","الإجابة: ج"]},"p198-q02":{"s":["أ ب = أ ج (علامتا التساوي) فـ ق(أ ب ج) = ق(أ ج ب) = ل","ل + ل < ١٨٠ فـ ل < ٩٠{deg}","ق(أ ج د) = ١٨٠ − ل > ٩٠{deg}","إذن القيمة الثانية ق(أ ج د) أكبر من الأولى ق(أ ب ج)","الإجابة: ب (القيمة الثانية أكبر)"]},"p199-q01":{"s":["أ ب = أ ج (علامتا التساوي) وزاوية الرأس ٦٠{deg}","زاويتا القاعدة = (١٨٠ − ٦٠) ÷ ٢ = ٦٠{deg}","الزاوية الخارجية عند الرأس الأيمن = ١٨٠ − ٦٠ = ١٢٠{deg}","٣س = ١٢٠ فـ س = ٤٠{deg}","الإجابة: ج"]},"p199-q02":{"s":["الزاويتان س و ص في المثلث الأيسر فالزاوية الثالثة عند نقطة التقاطع = ١٨٠ − ٨٠ − ٧٠ = ٣٠{deg}","الزاوية م هي الزاوية العلوية بين الشعاعين العلويين وهي مجاورة لهذه الزاوية على مستقيم","م = ١٨٠ − ٣٠ = ١٥٠{deg}","١٥٠ > ١١٠","الإجابة: أ (القيمة الأولى أكبر)"]},"p200-q01":{"s":["ص زاوية داخلية مجاورة للزاوية الخارجية ١٤٥{deg} فـ ص = ١٨٠ − ١٤٥ = ٣٥{deg}","س + الزاوية الداخلية الأخرى = ١٤٥{deg} وقيمتاهما غير معطاتين","مثال: الأخرى ٤٥{deg} فـ س = ١٠٠{deg} > ٣٥{deg}","مثال: الأخرى ١٣٥{deg} فـ س = ١٠{deg} < ٣٥{deg}","النتيجة تتغير","الإجابة: د (المعلومات غير كافية)"]},"p200-q02":{"s":["مجموع الزوايا الداخلية لمثلث = ١٨٠{deg} فالقيمة الأولى = ٢ × ١٨٠ = ٣٦٠{deg}","مجموع الزوايا الخارجية (زاوية عند كل رأس) = ٣٦٠{deg}","القيمتان متساويتان","الإجابة: ج"]},"p200-q03":{"s":["س و د زاويتان متجاورتان على مستقيم فمجموعهما ١٨٠{deg}","د = {frac:١|٣} س فـ {frac:٤|٣} س = ١٨٠","س = ١٣٥{deg}","١٣٥ > ١٢٠","الإجابة: أ (القيمة الأولى أكبر)"]},"p201-q01":{"s":["ب زاوية داخلية وأ زاوية خارجية عند الرأس نفسه ومتجاورتان على مستقيم، فأ + ب = ١٨٠{deg}","ج + د + ب = ١٨٠ فـ ج + د = ١٨٠ − ب < ١٨٠","إذن أ + ب أكبر","الإجابة: أ (القيمة الأولى أكبر)"]},"p201-q02":{"s":["س = ١٨٠ − ل وص = ١٨٠ − ن، وع = ١٨٠ − ن − ل","القيمة الأولى = س + ن − ع = ٢ن","القيمة الثانية = ص + ل − ع = ٢ل","المثلث غير معلوم فيه ن و ل: ن = ٧٠ و ل = ٥٠ تجعل الأولى أكبر، ون = ٥٠ و ل = ٧٠ تجعل الثانية أكبر","الإجابة: د (المعلومات غير كافية)"]},"p202-q01":{"s":["الزاوية الخارجية عند ج = ٣س = ٣ × ٤٠ = ١٢٠{deg}","الزاوية الداخلية عند ج = ١٨٠ − ١٢٠ = ٦٠{deg}","أ ب = أ ج (علامتا التساوي) فزاويتا القاعدة متساويتان: ب = ج = ٦٠{deg}","ص = ١٨٠ − ٦٠ − ٦٠ = ٦٠{deg}","٦٠ > ٥٠","الإجابة: أ (القيمة الأولى أكبر)"]},"p202-q02":{"s":["الشكل خماسي والزوايا الخارجية المرسومة زاوية عند كل رأس","مجموع الزوايا الخارجية لأي مضلع محدب = ٣٦٠{deg}","س + س + س + ٣س + ٢س = ٣٦٠","٨س = ٣٦٠ فـ س = ٤٥{deg}","الإجابة: ب"]},"p203-q02":{"s":["علامتا التساوي على الضلعين من الرأس فالمثلث الصغير متساوي الساقين","زاوية القاعدة اليمنى للمثلث الصغير = ١٨٠ − ١٥٠ = ٣٠{deg}","س هي زاوية القاعدة اليسرى فـ س = ٣٠{deg}","الإجابة: أ"]},"p203-q03":{"s":["الزاوية ٥٠{deg} مقابلة بالرأس للزاوية الداخلية اليسرى فهي ٥٠{deg}","مجموع الزاويتين الداخليتين الأخريين = ١٨٠ − ٥٠ = ١٣٠{deg}","ص و س زاويتان خارجيتان مجاورتان لتينك الزاويتين: س + ص = (١٨٠ − ج) + (١٨٠ − ب) = ٣٦٠ − ١٣٠ = ٢٣٠","الإجابة: أ"]},"p204-q01":{"s":["م مركز الدائرة والخط المار بها قطر","الزاوية ١٠٠{deg} مع زاوية ب م أ على مستقيم: ب م أ = ١٨٠ − ١٠٠ = ٨٠{deg}","م ب = م أ (نصفا قطر) فالمثلث ب م أ متساوي الساقين","س = (١٨٠ − ٨٠) ÷ ٢ = ٥٠{deg}","الإجابة: د"]},"p204-q02":{"s":["الزاوية ١٢٠{deg} خارجية عند الرأس العلوي فالزاوية الداخلية = ١٨٠ − ١٢٠ = ٦٠{deg}","الزاوية ٦٥{deg} تقابل بالرأس زاوية المثلث العلوي الأيسر عند نقطة التقاطع فهي ٦٥{deg}","س = ١٨٠ − ٦٠ − ٦٥ = ٥٥{deg}","الإجابة: ب"]},"p205-q01":{"s":["١٠٠{deg} زاوية خارجية عند الرأس الأيمن فالداخلية = ٨٠{deg}","زاوية رأس المثلث = ١٨٠ − ٦٠ − ٨٠ = ٤٠{deg} = ٢س فـ س = ٢٠{deg}","في المثلث الأيمن الصغير: هـ = ١٨٠ − ٢٠ − ٨٠ = ٨٠{deg}","الإجابة: د"]},"p205-q02":{"s":["زاوية الرأس للمثلث الكبير = ١٨٠ − ٢٠ − ٤٠ = ١٢٠{deg}","هي مجموع س و٦٠{deg} فـ س = ١٢٠ − ٦٠ = ٦٠{deg}","٦٠ > ٥٠","الإجابة: أ (القيمة الأولى أكبر)"]},"p206-q01":{"s":["المثلث العلوي: س + ص = ١٨٠ − ٥٠ = ١٣٠","المثلث الكبير: ل + ع = ١٨٠ − ٥٠ = ١٣٠","المجموع = ١٣٠ + ١٣٠ = ٢٦٠","الإجابة: د"]},"p206-q02":{"s":["المثلث الأيسر: ص = ١٨٠ − ٦٠ − ٨٠ = ٤٠{deg}","على المستقيم: ٧٠ + س + ٧٠ = ١٨٠ فـ س = ٤٠{deg}","س = ص","الإجابة: ج"]},"p207-q01":{"s":["المثلث الأيسر الكبير (رأساه ج وركن القاعدة الأيسر والركن الأيمن): زواياه ج و (د + ٤٠) و ٣٠","ج + (د + ٤٠) + ٣٠ = ١٨٠ فـ ج + د = ١١٠{deg}","المثلث الأيمن الكبير (رأساه أ وركن القاعدة الأيمن والركن الأيسر): زواياه أ و (ب + ٣٠) و ٤٠","أ + (ب + ٣٠) + ٤٠ = ١٨٠ فـ أ + ب = ١١٠{deg}","أ + ب + ج + د = ١١٠ + ١١٠ = ٢٢٠{deg}","الإجابة: د"]},"p207-q02":{"s":["الزاويتان الأيسر والأيمن متقابلتان بالرأس فهما متساويتان","٢(س + ٤) = ٦س − ٤","٢س + ٨ = ٦س − ٤ فـ ٤س = ١٢ و س = ٣","كل منهما = ٢ × ٧ = ١٤{deg}","ص مجاورة لهما على مستقيم: ص = ١٨٠ − ١٤ = ١٦٦{deg}","الإجابة: أ"]},"p208-q01":{"s":["الزاويتان متقابلتان بالرأس فهما متساويتان","٤س + ١٥ = ٥س فـ س = ١٥","١٥ < ٣٠","الإجابة: ب (القيمة الثانية أكبر)"]},"p208-q02":{"s":["في المثلث السفلي زاويتا القاعدة ٤٠{deg} و٤٠{deg} فالزاوية س = ١٨٠ − ٤٠ − ٤٠ = ١٠٠{deg}","ص تقابل س بالرأس فـ ص = ١٠٠{deg}","س + ص = ٢٠٠","الإجابة: ب"]},"p209-q01":{"s":["الشكل الرباعي رؤوسه على الدائرة (رباعي دائري) والزاويتان ٢س و س متقابلتان","كل زاويتين متقابلتين في الرباعي الدائري متكاملتان","٢س + س = ١٨٠ فـ ٣س = ١٨٠ و س = ٦٠{deg}","الإجابة: ج"]},"p209-q02":{"s":["الرباعي رؤوسه على الدائرة والزاويتان ج و س متقابلتان فهما متكاملتان","ج + س = ١٨٠ وس = ٢ج","٣ج = ١٨٠ فـ ج = ٦٠{deg}","الإجابة: د"]},"p210-q01":{"s":["المثلثان لهما الوتر الأفقي المشترك، ورؤوسهما على الدائرة","الرباعي الدائري: الزاوية ١٠٠{deg} عند الرأس العلوي تقابلها الزاوية عند أ، ومجموعهما ١٨٠{deg} فزاوية أ = ٨٠{deg}","المثلث السفلي: س = ١٨٠ − ٦٠ − ٨٠ = ٤٠{deg}","الإجابة: أ"]},"p210-q02":{"s":["الزوايا الأربع على المستقيم مجموعها ١٨٠{deg}","٢س + ٣٠ + س + ٢س = ١٨٠","٥س = ١٥٠ فـ س = ٣٠","الإجابة: أ (٣٠{deg})"]},"p211-q01":{"s":["الزوايا الخمس على المستقيم مجموعها ١٨٠{deg}","س + ٢س + ٣س + ٤س + ٥س = ١٨٠","١٥س = ١٨٠ فـ س = ١٢","الإجابة: ب"]},"p211-q02":{"s":["س و٤س زاويتان متجاورتان على مستقيم","س + ٤س = ١٨٠ فـ ٥س = ١٨٠","س = ٣٦","الإجابة: ب"]},"p211-q03":{"s":["الزاويتان ٥٥{deg} و٤٥{deg} تقابلان بالرأس الزاويتين العلويتين المجاورتين لـ س على جانبيها","س + ٥٥ + ٤٥ = ١٨٠ (زوايا على مستقيم)","س = ٨٠{deg}","الإجابة: ب"]},"p212-q01":{"s":["المستقيمان س ص و أ ب متقاطعان في م","ق(ص م ب) = ق(س م أ) = ٤٥{deg} (متقابلتان بالرأس)","الزوايا ص م ب و س (ب م ه) و ٥٥{deg} (ه م س) تملأ نصف الدائرة على المستقيم ص س","٤٥ + س + ٥٥ = ١٨٠","س = ٨٠{deg}","الإجابة: ج"]},"p212-q02":{"s":["الضلعان العلوي والسفلي متوازيان (شبه منحرف)","س تبادل داخلي مع الزاوية ٥٠{deg} عند الرأس السفلي الأيسر بين القاعدة والقطر نفسه: س = ٥٠{deg}","ص تبادل داخلي مع الزاوية ٤٥{deg} عند الرأس السفلي الأيمن: ص = ٤٥{deg}","س + ص = ٩٥","الإجابة: ج"]},"p213-q01":{"s":["مجموع الزوايا حول نقطة = ٣٦٠{deg}","ع + ٢س + ٢ص = ٣٦٠","٢(س + ص) = ٣٦٠ − ع فـ س + ص = ١٨٠ − {frac:ع|٢}","١٨٠ − س − ص = {frac:ع|٢}","الإجابة: ب"]},"p213-q02":{"s":["الزاوية المجهولة بين الشعاع الأيمن السفلي والمستقيم الأفقي تقابل ٣٠{deg} بالرأس فهي ٣٠{deg}","مجموع الزوايا الست حول النقطة = ٣٦٠{deg}","أ + ب + ج + د = ٣٦٠ − ٣٠ − ٣٠ = ٣٠٠","الإجابة: ج"]},"p214-q01":{"s":["س و ص زاويتان حول نقطة (المركز) ومجموعهما ٣٦٠{deg}","ص = ٥س فـ ٦س = ٣٦٠","س = ٦٠{deg}","الإجابة: أ"]},"p214-q02":{"s":["الزاوية القائمة ٩٠{deg} والزاوية ١٤٠{deg} وس حول النقطة نفسها","٩٠ + ١٤٠ + س = ٣٦٠","س = ١٣٠{deg}","الإجابة: ج"]},"p214-q03":{"s":["٨٠{deg} زاوية خارجية للمثلث عند قاعدته فالداخلية = ١٨٠ − ٨٠ = ١٠٠{deg}","الزاوية عند ص في المثلث = ١٨٠ − ٥٠ − ١٠٠ = ٣٠{deg}","ق(ع ص ل) تقابل هذه الزاوية بالرأس لأن ل على امتداد الضلع المائل","الإجابة: أ (٣٠{deg})"]},"p215-q02":{"s":["علامات التطابق على الأضلاع الثلاثة فالمثلث متساوي الأضلاع","زواياه متساوية وكل منها س","٣س = ١٨٠ فـ س = ٦٠{deg}","القيمة الأولى = ٣ × ٦٠ × ٢ = ٣٦٠","القيمتان متساويتان","الإجابة: ج"]},"p216-q02":{"s":["علامتا التساوي على الضلعين المائلين فالمثلث متساوي الساقين","زاويتا القاعدة متساويتان","س و ص زاويتان خارجيتان عند طرفي القاعدة، كل منهما مكملة لزاوية القاعدة بالتجاور على المستقيم","إذن س = ١٨٠ − زاوية القاعدة = ص","القيمتان متساويتان","الإجابة: ج"]},"p217-q01":{"s":["زاوية الرأس θ تُقرأ من الرسم ٦٠{deg} أو ٦١{deg}","علامتا التساوي على الضلعين فزاويتا القاعدة (المجهولتان) متساويتان، كل منهما {frac:١٨٠ − θ|٢}","إذا كانت θ < ٦٢ فإن {frac:١٨٠ − θ|٢} > ٥٩ في الحالتين (٦٠ أو ٦١)","القيمة الثانية أكبر","الإجابة: ب"]},"p217-q02":{"s":["مجموع زوايا الخماسي = (٥ − ٢) × ١٨٠ = ٥٤٠{deg}","الزوايا الأربع المعلومة: ٩٠ + ٦٠ + ١٣٠ + ١٦٠ = ٤٤٠{deg}","الزاوية الداخلية الخامسة عند الأسفل (على المستقيم) = ٥٤٠ − ٤٤٠ = ١٠٠{deg}","س تجاور هذه الزاوية على المستقيم فـ س = ١٨٠ − ١٠٠ = ٨٠{deg}","الإجابة: أ"]},"p218-q01":{"s":["الضلع المائل الأيسر = قطعة القاعدة اليسرى (علامة واحدة)","فالمثلث المتكون عند الزاوية ٢٠{deg} متساوي الساقين وزاويتاه الأخريان = {frac:١٨٠ − ٢٠|٢} = ٨٠{deg}","الزاوية عند نقطة القاعدة (داخل المثلث الأيسر) = ٨٠{deg} فمجاورتها على المستقيم = ١٠٠{deg}","القطعة المائلة = قطعة القاعدة اليمنى (علامتان) فالمثلث الأيمن متساوي الساقين برأسه عند نقطة القاعدة","زاويتا قاعدته = {frac:١٨٠ − ١٠٠|٢} = ٤٠{deg} وس إحداهما","الإجابة: أ"]},"p218-q02":{"s":["المطلوب عدديا: مجموع س + ص + ع (الخيارات قيم عددية)","المثلثات الثلاثة متساوية الأضلاع (علامات التساوي) وزاوية كل منها ٦٠{deg}","عند النقطة المشتركة على المستقيم: ص + ٦٠ + س = ١٨٠ فـ س + ص = ١٢٠","ع + ٦٠ + ٦٠ = ١٨٠ فـ ع = ٦٠","س + ص + ع = ١٢٠ + ٦٠ = ١٨٠{deg}","الإجابة: ب"]},"p219-q01":{"s":["علامتا التساوي: ب ج = ج أ فالمثلث ب ج أ متساوي الساقين وزاويتا القاعدة (ب وأ) متساويتان","٥٠{deg} زاوية خارجية للمثلث عند ج","الزاوية الخارجية = مجموع الزاويتين الداخليتين البعيدتين = ب + أ = ٢أ","٢أ = ٥٠ فـ أ = ٢٥{deg}","الإجابة: أ"]},"p219-q02":{"s":["مجموع زوايا أي مضلع محدب ذي ن ضلعاً = (ن − ٢) × ١٨٠","للثماني: (٨ − ٢) × ١٨٠ = ١٠٨٠{deg}","القيمتان متساويتان","الإجابة: ج"]},"p219-q03":{"s":["س و ص زاويتان داخليتان في الرباعي مع ١٠٠{deg} و٩٥{deg}","مجموع زوايا الرباعي = ٣٦٠{deg}","س + ص = ٣٦٠ − ١٠٠ − ٩٥ = ١٦٥{deg}","الإجابة: د"]},"p220-q03":{"s":["مجموع الزوايا الخارجية لأي مضلع محدب = ٣٦٠{deg}","في السداسي المنتظم كل زاوية خارجية = {frac:٣٦٠|٦} = ٦٠{deg}","س زاوية خارجية عند رأس القاعدة بين الضلع وامتداد القاعدة","س = ٦٠{deg}","الإجابة: أ"]},"p221-q01":{"s":["كل زاوية داخلية في السداسي المنتظم = {frac:٧٢٠|٦} = ١٢٠{deg}","س و ص زاويتان على المستقيم مع زاويتين داخليتين فكل منهما = ١٨٠ − ١٢٠ = ٦٠{deg}","س + ص = ١٢٠{deg}","الإجابة: ب"]},"p221-q02":{"s":["ل ⟂ ك فالزاوية بين الشعاعين عند نقطة التقاطع = ٩٠{deg}","الرباعي المقعر: زواياه ٩٠{deg} و٣٠{deg} و٢٠{deg} وس (داخلية عند الرأس السفلي)","مجموع زوايا الرباعي = ٣٦٠{deg}","س = ٣٦٠ − ٩٠ − ٣٠ − ٢٠ = ٢٢٠{deg}","الإجابة: ب"]},"p221-q03":{"s":["الزاوية ٥٠{deg} على يسار القطعة المائلة، فالزاوية المجاورة لها على الضلع العلوي في الرباعي الأيمن = ١٨٠ − ٥٠ = ١٣٠{deg}","الزاوية ٧٠{deg} داخل الرباعي الأيمن عند القاعدة","الرباعي الأيمن: ١٣٠ + ٧٠ + س + ص = ٣٦٠","س + ص = ٣٦٠ − ٢٠٠ = ١٦٠{deg}","الإجابة: ج"]},"p222-q01":{"s":["قطرا المستطيل متساويان وينصف كل منهما الآخر","المثلث العلوي (ضلعه الضلع العلوي وقطراه) متساوي الساقين","الزاوية المقابلة للضلع العلوي عند التقاطع = ١٨٠ − ٧٠ = ١١٠{deg} (٧٠{deg} على يسار نقطة التقاطع)","س زاوية قاعدته = {frac:١٨٠ − ١١٠|٢} = ٣٥{deg}","الإجابة: د"]},"p222-q02":{"s":["المستقيمان الأفقيان متوازيان والقاطعان يلتقيان عند المستقيم السفلي","الزاوية ٧٠{deg} تقابل بالرأس زاوية المثلث العلوي عند اليسار فهي ٧٠{deg}","الزاوية ٤٠{deg} تقابل بالرأس زاوية المثلث عند اليمين فهي ٤٠{deg}","س زاوية رأس المثلث = ١٨٠ − ٧٠ − ٤٠ = ٧٠{deg}","الإجابة: د"]},"p223-q01":{"s":["في المثلث القائم أ ب ج: ق(ب أ ج) = ٩٠ − ٣٠ = ٦٠{deg}","أ د ينصف الزاوية فـ ق(ج أ د) = ٣٠{deg}","في المثلث أ ج د القائم في ج: س = ٩٠ − ٣٠ = ٦٠{deg}","الإجابة: د"]},"p223-q02":{"s":["الزاوية ١٢٠{deg} تجاور س على مستقيم فـ س = ١٨٠ − ١٢٠ = ٦٠{deg}","ص تقابل س بالرأس فـ ص = ٦٠{deg}","س + ص = ١٢٠{deg}","الإجابة: ب"]},"p224-q01":{"s":["١٢٥{deg} تجاور ص على المستقيم فـ ص = ١٨٠ − ١٢٥ = ٥٥{deg}","في المثلث: س = ١٨٠ − ٩٥ − ٥٥ = ٣٠{deg}","٥٥ > ٣٠ فالقيمة الثانية (ص) أكبر","الإجابة: ب"]},"p224-q02":{"s":["الزاويتان ٣٫٥س و٥٫٥س متجاورتان على مستقيم","٣٫٥س + ٥٫٥س = ١٨٠","٩س = ١٨٠ فـ س = ٢٠","الإجابة: ج"]},"p224-q03":{"s":["الزوايا الثلاث ص عند الرأس العلوي الأيسر تملأ الزاوية القائمة: ٣ص = ٩٠ فـ ص = ٣٠{deg}","في المثلث العلوي: زاوية عند الرأس الأيمن العلوي ٩٠{deg} وعند الأيسر ٣٠{deg} فالزاوية الثالثة = ٦٠{deg}","س تجاورها على الضلع الأيمن فـ س = ١٨٠ − ٦٠ = ١٢٠{deg}","الإجابة: ج"],"k":2},"p225-q02":{"s":["△ م و ن متطابق الأضلاع فأضلاعه الثلاثة أوتار متساوية","الأقواس الثلاثة المقابلة لها متساوية ومجموعها ٣٦٠{deg}","كل قوس = {frac:٣٦٠|٣} = ١٢٠{deg}","القوس م ن (الأصغر) = ١٢٠{deg}","الإجابة: ج"]},"p226-q01":{"s":["الرباعي العلوي رؤوسه: الرأس العلوي الأيسر (١١٢{deg}) والعلوي الأيمن (٩٠{deg}) والسفلي الأيمن والنقطة على الضلع الأيسر","الزاوية عند السفلي الأيمن بين القطر والضلع القائم = ٩٠ − ٢٥ = ٦٥{deg}","مجموع زوايا الرباعي = ٣٦٠{deg}","س = ٣٦٠ − ١١٢ − ٩٠ − ٦٥ = ٩٣{deg}","الإجابة: ب"]},"p226-q02":{"s":["المثلث (رأسه العلوي ٦٥{deg} وقاعدته الزاوية ٤٠{deg}): الزاوية عند نقطة القاعدة = ١٨٠ − ٦٥ − ٤٠ = ٧٥{deg}","مجاورتها على القاعدة (داخل المثلث الصغير) = ١٨٠ − ٧٥ = ١٠٥{deg}","في المثلث الصغير: ٥٠ + ١٠٥ + س = ١٨٠","س = ٢٥{deg}","الإجابة: ب"]},"p226-q03":{"s":["الزوايا الست حول النقطة على مستقيم: أربع منها س واثنتان ص","٤س + ٢ص = ١٨٠","بالقسمة على ٢: ٢س + ص = ٩٠{deg}","الإجابة: ب"]},"p227-q01":{"s":["المستقيمان يتقاطعان عند ج والزاوية العلوية ب ج أ = ١١٠{deg}","أ ج و تجاورها على المستقيم ب د","أ ج و = ١٨٠ − ١١٠ = ٧٠{deg}","الإجابة: ب"]},"p228-q02":{"s":["المثلث الأيسر: س + ٣س + (س + ١٠) = ١٨٠","٥س + ١٠ = ١٨٠ فـ س = ٣٤","القيمة الأولى = س + ٢٠ = ٥٤","المثلث الأيمن: ٢ص + ٧ص + ص = ١٨٠","١٠ص = ١٨٠ فـ ص = ١٨","القيمة الثانية = ٣ص = ٥٤","القيمتان متساويتان","الإجابة: ج"]},"p229-q01":{"s":["زوايا المثلث المرسوم: ١٠٠{deg} و٥٠{deg} و٣٠{deg}","الزاوية ١٠٠{deg} أكبر من ٩٠{deg} فهي منفرجة","المثلث منفرج الزاوية","الإجابة: ب"]},"p229-q02":{"s":["الزاويتان ٥٥{deg} و٥٥{deg} وس تقع بينهما على المستقيم الأفقي","٥٥ + س + ٥٥ = ١٨٠","س = ٧٠{deg}","الإجابة: ب"]},"p230-q01":{"s":["لا توجد علامات تساوٍ على أضلاع المثلث ولا مركز مبين فلا يُفترض أن ضلعين متساويان","نفرض أن القاعدة وتراً ثابتاً والرأس على القوس العلوي: زاوية الرأس ثابتة فمجموع س + ص ثابت","المثال الأول: الرأس في منتصف القوس فيكون المثلث متساوي الساقين وس = ص","المثال الثاني: نحرك الرأس على القوس فيصبح س ≠ ص","المقارنة تتغير بحسب موضع الرأس","الإجابة: د (المعطيات غير كافية)"]},"p230-q02":{"s":["العلامتان المزدوجتان: أ ب = ب د = أ ج","أ ب = أ ج فزاويتا القاعدة ب و ج متساويتان وكل منهما ٤٠{deg}","ق(ب أ ج) = ١٨٠ − ٤٠ − ٤٠ = ١٠٠{deg}","أ ب = ب د فالمثلث أ ب د متساوي الساقين وزاويتاه عند أ و د = {frac:١٨٠ − ٤٠|٢} = ٧٠{deg}","س = ق(د أ ج) = ١٠٠ − ٧٠ = ٣٠{deg}","الإجابة: أ"],"k":0},"p231-q01":{"s":["١٥٠{deg} على المستقيم الأفقي تجاور زاوية المثلث العلوي عند اليمين","زاوية المثلث العلوي عند اليمين = ١٨٠ − ١٥٠ = ٣٠{deg}","س = ١٨٠ − ٦٠ − ٣٠ = ٩٠{deg}","الإجابة: ب"]},"p232-q02":{"s":["علامة واحدة على الضلعين العلويين وعلامتان على الضلعين السفليين، والقطر الأفقي مشترك","المثلثان العلوي والسفلي متساويا الساقين لكن قطعتا التساوي مختلفتان في الطول","المثال الأول: كل الأضلاع متساوية (معين) فـ س = ص","المثال الثان function stepHTML(t){
  t=esc(t);
  t=t.replace(/\{\^([^}]*)\}/g,'<span class="ex">$1</span>');
  t=t.replace(/\{sqrt:([^}]*)\}/g,'<span class="rad"><span class="sg">√</span><span class="vn">$1</span></span>');
  t=t.replace(/\{frac:([^|}]*)\|([^}]*)\}/g,'<span class="fr"><span class="n">$1</span><span class="d">$2</span></span>');
  return t.replace(/\{deg\}/g,'<span class="ex">○</span>');
}
function whyBox(q){
  if(!q.reason&&!STEP_SOL[q.id])return '';
  if(STEP_SOL[q.id])return `<div class="why">${CORRECTED_Q.has(q.id)?'<div class="note" style="background:#fff3d6;color:#6b4e00;border:1px solid #e0b84d;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px">تنبيه: تم تصحيح مفتاح إجابة هذا السؤال في التطبيق بعد المراجعة.</div>':''}<b>الحل خطوة بخطوة:</b><ol class="steps">${STEP_SOL[q.id].s.map(t=>`<li><bdi>${stepHTML(t)}</bdi></li>`).join('')}</ol></div>`;
  if(REASON_OV[q.id])return `<div class="why"><b>لماذا؟</b><div class="r">${REASON_OV[q.id]}</div></div>`;
  if(SHOWN_REASONS.has(q.id))return `<div class="why"><b>لماذا؟</b><div class="r">${fmtReason(q.reason)}</div></div>`;

}

function fmtReason(r){
  if(!r)return '';
  const raw=String(r).trim();
  return raw.split(/;\s*/).map(step=>{
    let t=esc(step);
    for(const[a,b]of RE_PHRASES)t=t.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),b);
    t=t.replace(/\bsqrt\s*\(([^)]*)\)/g,'√($1)');
    t=t.replace(/\bsqrt\s*(\d+(?:\.\d+)?)/g,'√$1');
    t=t.replace(/-&gt;/g,' ← ');
    t=t.replace(/\*/g,'×').replace(/\^2/g,'²').replace(/\^3/g,'³');
    t=t.replace(/[a-zA-Z]{2,}/g,w=>RE_WORDS[w.toLowerCase()]||w);
    t=t.replace(/\d+(\.\d+)?/g,m=>ar(m).replace(/\./g,'٫'));
    return t;
  }).join('<br>');
}

async function collect(pages){

function normW(v){return (v&&typeof v==='object')?v:{a:null,t:(typeof v==='number'?v:Date.now()),first:(typeof v==='number'?v:Date.now()),corrected:false};}
function fmtAns(q,a){

function recordAnswer(ref,ok,chosen){
  store.patch(o=>{

      if(o.wrongs[ref]!==undefined){const w=normW(o.wrongs[ref]);w.corrected=true;w.ct=Date.now();o.wrongs[ref]=w;}
    }else{
      const w=normW(o.wrongs[ref]);
      w.a=(chosen===undefined?null:chosen);w.t=Date.now();w.corrected=false;
      o.wrongs[ref]=w;
    }
  });
}

}

function fmt(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;return ar(m)+':'+ar(String(ss).padStart(2,'0'));}
function remaining(){
  if(!SESS||!SESS.timed)return null;
  if(SESS.timed==='q')return Math.max(0,SESS.perQ-(Date.now()-SESS.startQAt)/1000);
  return Math.max(0,(SESS.endsAt-Date.now())/1000);
}
function renderTimer(){
  const el=$('#timer');if(!el||!SESS||!SESS.timed)return;

}
function onTimeUp(){
  if(SESS.timed==='q'){
    // lock any in-progress selection, then close the question and move on
    if(!SESS.checked[SESS.current])confirmAnswer();
    if(SESS.current<SESS.items.length-1){goQ(SESS.current+1);}
    else{finish();}
  }else{finish();}
}

}

function newSession(s){
  stopTick();
  SESS=Object.assign({answers:{},checked:{},current:0},s);
  if(SESS.timed==='total')SESS.endsAt=Date.now()+SESS.totalSec*1000;
  SESS.startQAt=Date.now();
  persistSess();
  startTick();
  renderQ();
}
function persistSess(){
  // persist lightweight session (without big images) for resume
  const lite={mode:SESS.mode,sid:SESS.sid,title:SESS.title,timed:SESS.timed,perQ:SESS.perQ,totalSec:SESS.totalSec,answers:SESS.answers,checked:SESS.checked,current:SESS.current,refs:SESS.items.map(it=>({page:it.page,id:it.q.id}))};
  store.patch(o=>{o.session=lite;});
}
async function resume(){
  const lite=store.get().session;if(!lite)return;
  view().innerHTML='<div class="spin">جارٍ استئناف الاختبار…</div>';
  const byPage={};for(const r of lite.refs)(byPage[r.page]=byPage[r.page]||[]).push(r.id);
  let items=[];
  for(const p of Object.keys(byPage)){const d=await loadPage(Number(p));for(const q of d.questions)if(byPage[p].includes(q.id))items.push({page:Number(p),q});}
  if(lite.mode==='wrongs'){const W=store.get().wrongs||{};items.forEach(it=>{it.wrec=normW(W[it.page+'|'+it.q.id]||null);});}
  const order=lite.refs.map(r=>r.page+'|'+r.id);
  items.sort((a,b)=>order.indexOf(a.page+'|'+a.q.id)-order.indexOf(b.page+'|'+b.q.id));
  SESS={mode:lite.mode,sid:lite.sid,title:lite.title,timed:lite.timed,perQ:lite.perQ,answers:lite.answers||{},checked:lite.checked||{},current:lite.current||0,items};
  if(SESS.timed==='total')SESS.endsAt=Date.now()+(lite.totalSec||1500)*1000;
  SESS.startQAt=Date.now();
  startTick();renderQ();
}
/* ---------- question rendering ---------- */
function goQ(i){SESS.current=i;SESS.startQAt=Date.now();persistSess();renderQ();window.scrollTo(0,0);}
function renderQ(){
  const it=SESS.items[SESS.current];const q=it.q;const i=SESS.current;
  const n=SESS.items.length;
  const checked=!!SESS.checked[i];
  const a=SESS.answers[i];
  let input='';
  if(q.type==='multiple_choice'){
    input='<div class="opts">'+letters.map((l,k)=>{
      let cls='opt';if(a===k)cls+=' sel';
      if(checked){const ok=grade(q,a);const right=(q.answerSpec.option_index_1based-1)===k;if(right)cls+=' right';else if(a===k)cls+=' wrong';}
      return `<button class="${cls}" data-k="${k}" ${checked?'disabled':''}>${l}</button>`;
    }).join('')+'</div>';
  }else if(q.type==='choice_set'){
    const sel=Array.isArray(a)?a:[];
    input='<div class="opts">'+letters.map((l,k)=>{
      let cls='opt'+(sel.includes(k)?' sel':'');
      return `<button class="${cls}" data-mk="${k}" ${checked?'disabled':''}>${l}</button>`;
    }).join('')+'</div><div class="note" style="color:#6b7c8a">اختر كل الإجابات الصحيحة ثم اضغط تأكيد</div>';
  }else{
    const hint=q.type==='ratio'?'مثال: 3:5 أو 0.6':q.type==='percentage'?'مثال: 25٪ أو 25':'اكتب الناتج';
    input=`<div class="freein"><input id="freev" inputmode="text" placeholder="${hint}" value="${a!=null?esc(a):''}" ${checked?'disabled':''}></div>`;
  }
  let fb='';
  if(checked){
    const ok=grade(q,a);
    fb=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'إجابة صحيحة ✅':'إجابة غير صحيحة ❌'}</b> — الإجابة الصحيحة: <b>${esc(correctText(q))}</b></div>`;
    if(q.reason||STEP_SOL[q.id])fb+=whyBox(q);
    else if(q.answerDisplay!=null&&q.type!=='multiple_choice')fb+=`<div class="why"><b>الناتج:</b> ${esc(q.answerDisplay)}</div>`;
  }
  const trainMode=!SESS.timed;
  view().innerHTML=barHTML(SESS.title,!!SESS.timed)+`
  <div class="prog"><i style="width:${Math.round((i)/n*100)}%"></i></div>
  <div class="qcard">
    <div class="qnum">سؤال ${ar(i+1)} من ${ar(n)} · صفحة ${ar(it.page)} من المذكرة</div>
    <div class="qimg"><img src="${q.readerImage||q.image}" alt="السؤال" onload="fitImg(this)" onclick="zoomImg(this.src)"><div class="zoomhint">اسحب الصورة أفقيًا عند الحاجة · اضغط عليها للتكبير 🔍</div></div>
    ${it.wrec?`<div class="wrec">إجابتك الخاطئة: <b>${esc(fmtAns(q,it.wrec.a))}</b>${it.wrec.corrected?' · <span class="wok">صحّحتها ✅</span>':''}</div>`:''}
    ${input}
    ${fb}
    <div class="btnrow">
      ${!checked?`<button class="btn gold" id="confirm">تأكيد الإجابة</button>`:''}
      ${checked||!trainMode?(i<n-1?`<button class="btn" id="nextq">السؤال التالي</button>`:`<button class="btn gold" id="finish">إنهاء وعرض النتيجة</button>`):''}
      ${trainMode&&!checked?`<button class="btn ghost" id="skipq">تخطَّ</button>`:''}
    </div>
  </div>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SESS.answers[i]=Number(b.dataset.k);renderQ();});
  document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const k=Number(b.dataset.mk);let arr=Array.isArray(SESS.answers[i])?[...SESS.answers[i]]:[];arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];SESS.answers[i]=arr;renderQ();});
  const cf=$('#confirm');if(cf)cf.onclick=confirmAnswer;
  const nx=$('#nextq');if(nx)nx.onclick=()=>goQ(i+1);
  const fn=$('#finish');if(fn)fn.onclick=finish;
  const sk=$('#skipq');if(sk)sk.onclick=()=>goQ(Math.min(i+1,n-1));
  const fi=$('#freev');if(fi){fi.addEventListener('keydown',e=>{if(e.key==='Enter')confirmAnswer();});}
  if(SESS.timed)renderTimer();
}
function confirmAnswer(){
  const i=SESS.current;const q=SESS.items[i].q;
  if(q.type!=='multiple_choice'&&q.type!=='choice_set'){const fi=$('#freev');if(fi)SESS.answers[i]=fi.value;}
  if(SESS.answers[i]===undefined||SESS.answers[i]===''||(Array.isArray(SESS.answers[i])&&!SESS.answers[i].length))return;
  if(!SESS.timed){
    SESS.checked[i]=true;
    const ok=grade(q,SESS.answers[i]);
    recordAnswer(SESS.items[i].page+'|'+q.id,!!ok,SESS.answers[i]);
    if(SESS.mode==='train'||SESS.mode==='wrongs'){
      store.patch(o=>{o.tp=o.tp||{};const k=SESS.sid;o.tp[k]=o.tp[k]||{a:0,c:0};o.tp[k].a++;if(ok)o.tp[k].c++;});
    }
  }else{
    SESS.checked[i]=true;
    recordAnswer(SESS.items[i].page+'|'+q.id,!!grade(q,SESS.answers[i]),SESS.answers[i]);
  }
  persistSess();renderQ();
}
function finish(){
  stopTick();
  const n=SESS.items.length;let score=0;const rows=[];
  SESS.items.forEach((it,i)=>{
    const a=SESS.answers[i];
    const ok=grade(it.q,a)===true;
    if(ok)score++;
    rows.push({i,it,a,ok});
  });
  if(SESS.mode==='test')bestScore(SESS.sid,score,n);
  store.patch(o=>{delete o.session;});
  const pct=n?score/n:0;
  const msg=pct>=.9?'ممتاز! نتيجة رائعة':pct>=.75?'جيد جدًا، قريب من التمام':pct>=.5?'جيد، راجع أخطاءك وستتحسن':'تحتاج تدريبًا أكثر على هذا الدرس';
  let h=barHTML('النتيجة — '+SESS.title,false);
  h+=`<div class="card result"><div class="big">أحرزت ${ar(score)} من ${ar(n)}</div><div class="msg">${msg}</div><div style="color:#6b7c8a;margin-top:6px">النسبة: ${ar(Math.round(pct*100))}٪</div>

    h+=`<div class="card review-item"><div class="st ${r.ok?'ok':'bad'}">${r.ok?'✅':'❌'} سؤال ${ar(r.i+1)} — صفحة ${ar(r.it.page)}</div>

    <div class="ans">إجابتك: <b>${esc(respLabel(r.it.q,r.a))}</b> · الصحيح: <b>${esc(correctText(r.it.q))}</b></div>
    ${whyBox(r.it.q)}
    </div>`;
  }
  view().innerHTML=h;window.scrollTo(0,0);
}
function respLabel(q,a){
  if(a===undefined||a===null||a==='')return 'بدون إجابة';
  if(q.type==='multiple_choice')return letters[a]??'—';
  if(q.type==='choice_set')return Array.isArray(a)?a.map(i=>letters[i]).join('، '):'—';
  return String(a);
}
