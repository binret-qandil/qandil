<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>معاينة شرح الدرس الأساسي</title>
<style>
  body { margin:0; background:#f6f3ec; font-family:'Segoe UI', Tahoma, Arial, sans-serif; color:#232323; }
  .wrap { max-width:760px; margin:0 auto; padding:28px 18px 48px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .meta { color:#6b6b6b; font-size:14px; margin:0 0 18px; }
  video { display:block; width:100%; border-radius:14px; background:#000; aspect-ratio:16/9; box-shadow:0 2px 14px rgba(0,0,0,.18); }
  .dl { display:inline-flex; align-items:center; justify-content:center; margin-top:18px; padding:13px 26px; min-height:46px;
        background:#1f5fa8; color:#fff; text-decoration:none; border-radius:10px; font-size:16px; font-weight:600; }
  .note { margin-top:22px; background:#fdf6e3; border:1px solid #e8d9a8; border-radius:10px; padding:12px 16px; font-size:14px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>معاينة شرح الدرس الأساسي</h1>
  <p class="meta">٣ دقائق و٢٠ ثانية · ٢٫١ ميجابايت · HD 720p</p>
  <video controls preload="metadata" playsinline src="preview.mp4"></video>
  <a class="dl" href="preview.mp4" download="qandil-preview.mp4">تنزيل ملف المعاينة (MP4)</a>
  <div class="note">هذه معاينة للافتتاحية وأسلوب الشرح فقط، وليست الدرس الكامل أو مثالًا محلولًا. النسخة الكاملة قيد التجهيز.</div>
</div>
</body>
</html>
